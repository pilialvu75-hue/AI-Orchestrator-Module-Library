schema_version: 2
repository: pilialvu75-hue/AI-Orchestrator-Module-Library
visibility_policy: private_only
updated_at: 2026-10-11
authority: repository_local
reconstructed_from:
  - historical_project_chats
  - current_repository_state
  - current_cross_repository_architecture

lifecycle:
  status: active
  role: authoritative_module_library
  predecessor: Template-wrapper
  successors: []

mission: >-
  Be the authoritative quarantine, certification, reuse, dependency and application-
  evolution boundary between Researcher discoveries, Cantiere-created reusable code,
  existing maintained applications and future execution environments.

history:
  - "Created as the dedicated reusable Module Library after the earlier Template-wrapper concept."
  - "Lifecycle established as discovered -> quarantined -> normalized -> tested -> certified -> deprecated/revoked."
  - "Cantiere and Researcher converge through Library rather than executing Researcher code directly."
  - "Untrusted upstream execution is isolated from Library write credentials."
  - "Cantiere private builds use read-only sparse checkout of staged source."
  - "Persistent private roadmap introduced on 2026-09-22."

current_state:
  historical_chat_archive:
    status: consolidated_2026_10_01
    registry: .airlab/control-plane/historical-chat-consolidation.json
    rule: Delete old chats only after unique actionable value has a canonical repository home.
  certification_pipeline:
    status: active
    fail_closed: true
  needs_reconciliation:
    status: active
    schedule: "7 */6 * * *"
    source: catalog/needs.json
  researcher_intake:
    status: active
    rule: "Researcher findings enter Library intake; never execute directly in Cantiere."
  upstream_runtime_isolation:
    status: active
    rule: "Untrusted upstream code executes without repository permissions or Library checkout."
  trusted_promotion:
    status: active
    rule: "Promotion runs on a fresh writer job and revalidates current intake identity."
  cantiere_return_path:
    status: active
    rule: "Validated reusable Cantiere output may enter only intake/<asset>/<version> as discovered."
  cantiere_consumption:
    status: active
    rule: "Cantiere consumes certified/hash-pinned Library packages through the guarded reuse path."
  cantiere_build_isolation:
    status: active
    rule: "Read-only sparse checkout of .cantiere-build/source with no persisted checkout credential."
  public_repository_roadmap_registry:
    status: active
    path: ".airlab/public-repositories/"
    rule: "Roadmaps for public repositories are stored privately in Module Library, not in the public repositories."
  first_party_legacy_mining:
    status: planned
    source_manifest: ".airlab/first-party-sources.yaml"
    rule: "Legacy private repositories may be mined read-only; extracted candidates still enter Library intake and certification."

architecture:
  trusted_code_flow:
    researcher_to_library: "candidate/reference/evidence -> intake"
    cantiere_to_library: "validated reusable code -> intake/discovered"
    library_to_cantiere: "certified/hash-pinned package only"
  control_plane:
    researcher_cantiere_direct_messages: "future_allowed_if_structured_sanitized_non_code"
  learning_loop: >-
    Missing capability -> Library need -> Researcher search in parallel with Cantiere local
    implementation -> validated Cantiere solution captured -> Library certification -> reuse ->
    integration/device feedback -> Library/Researcher improvement cycle.

invariants:
  - "No untrusted executable code may run with Library write credentials."
  - "No Researcher candidate source may bypass Library and execute directly in Cantiere."
  - "No Cantiere output may write directly to modules/ or the certified catalog."
  - "A missing capability is registered on first detection, not after repeated failures."
  - "Every reusable capability created by Cantiere is captured on its first successful validated implementation."
  - "Reuse is attempted before regeneration."
  - "A candidate from Researcher and an original Cantiere solution may coexist for comparison; neither overwrites certified state without Library gates."
  - "Library tracks which maintained applications depend on which capability/module versions."
  - "A newly built application version is never stable/released solely because CI is green."
  - "Physical-device validation is mandatory before stable distribution of evolved applications."
  - "Roadmap/private state remains only in private repositories unless the owner changes this policy."

roadmap:
  - id: L1
    title: Persist private repository roadmap
    state: done
    priority: P0

  - id: L2
    title: Immediate capability-gap registration
    state: planned
    priority: P0
    outcome: >-
      When Cantiere discovers a missing capability while building the first application,
      Library records the gap immediately and makes it visible to Researcher.

  - id: L3
    title: Created-once reusable capture
    state: planned
    priority: P0
    outcome: >-
      The first validated reusable capability created by Cantiere is submitted to Library
      intake immediately with provenance, tests, security evidence, contracts, version and hashes.

  - id: L4
    title: Researcher-Cantiere structured control plane contract
    state: planned
    priority: P1
    outcome: >-
      Define sanitized non-code events such as research_request, capability_gap,
      candidate_found, no_match, certification_status, runtime_feedback and security_alert.

  - id: L5
    title: Application bill of capabilities
    state: planned
    priority: P0
    outcome: >-
      Persist which certified capability/module versions and Cantiere-originated reusable
      components are used by every maintained application.

  - id: L6
    title: Capability-update impact graph
    state: planned
    priority: P1
    outcome: >-
      A newly certified capability version identifies affected applications and classifies
      impact as security, bugfix, compatibility, performance, feature or refactor.

  - id: L7
    title: Continuous Application Evolution queue
    state: planned
    priority: P1
    outcome: >-
      Create durable upgrade candidates for affected applications and let Cantiere process
      them when higher-priority user work is absent.

  - id: L8
    title: Physical Device Validation gate
    state: planned
    priority: P0
    outcome: >-
      Candidate app versions must pass real-device installation, launch, affected-feature
      tests, crash/regression checks, performance/runtime observations and a validation receipt
      before stable release.

  - id: L9
    title: Release policy per application
    state: planned
    priority: P1
    outcome: >-
      Support manual_release, auto_internal, guarded_auto_stable and never_auto without
      weakening physical-device validation.

  - id: L10
    title: Integration feedback and module evolution
    state: planned
    priority: P1
    outcome: >-
      Feed real Cantiere integration results, device validation and regressions back into
      Library quality/versioning and Researcher improvement missions.

  - id: L11
    title: Multi-node future storage/replication compatibility
    state: planned
    priority: P2
    outcome: >-
      Keep Library contracts portable for future NAS/local/cloud storage without replacing
      the current GitHub authority prematurely.

  - id: L12
    title: First-party legacy repository mining
    state: planned
    priority: P1
    outcome: >-
      Give Researcher a read-only, explicit allowlist of owner-controlled legacy repositories
      so it can statically identify reusable code/patterns and submit candidates to Library
      intake without executing legacy source or bypassing certification.

  - id: L13
    title: Private roadmap registry for public repositories
    state: done
    priority: P0
    outcome: >-
      Keep the reconstructed roadmaps of public ecosystem repositories under
      .airlab/public-repositories/ inside this private Library.

  - id: L14
    title: Canonical multi-chat control plane
    state: active
    priority: P0
    outcome: >-
      Keep one continuously updated private coordination authority with specialized workstream
      lanes, bounded claims, strong evidence gates and Main/Reviewer-only promotion to VERIFIED/DONE.

  - id: L15
    title: Automated claim leases and canonical-state projection
    state: done
    priority: P0
    outcome: >-
      Add machine-driven stale-claim expiry/reconciliation and deterministic projection of merged
      workstream evidence into the global canonical state without allowing worker self-promotion.

  - id: L16
    title: Target-specific inference profile matrix
    state: active
    priority: P0
    outcome: >-
      Maintain benchmark-gated inference profiles per platform and hardware class so constrained
      targets are not overloaded and capable targets are not artificially limited, while preserving
      one shared inference/routing contract and reviewer-controlled promotion.

  - id: L17
    title: Canonical chat lane bootstrap and structured reviewer handoff
    state: done
    priority: P0
    outcome: >-
      Bind every operational chat to one canonical lane through a generated relay, enforce one current
      repository-backed identity/scope per chat, and require worker results to enter Main/Reviewer through
      a structured claim-bound review packet rather than conversational success claims.

  - id: L18
    title: Historical chat consolidation and deletion-safe archive registry
    state: done
    priority: P0
    outcome: >-
      Recover unique actionable work, decisions and evidence from accessible legacy AI Orchestrator chats,
      migrate them into canonical roadmaps/workstreams, and maintain a private deletion-safety registry so
      full/superseded chats can be removed without becoming project state.
  - id: L19
    title: Mature discovered inference candidates into usable Library assets
    state: active
    priority: P0
    outcome: >-
      Advance existing first-party ai.acceleration_backend and ai.local_inference discovered candidates through
      validation, security, target compatibility and certification/evidenced-adaptation instead of repeatedly rediscovering them.
    current_evidence:
      - ai.acceleration_backend.firstparty.ai-orchestrator-core/0.1.0 exists in intake as discovered.
      - ai.local_inference.firstparty.ai-orchestrator-core/0.1.0 exists in intake as discovered.
      - evo-a18f2c13c19927904ced0bbd is claimed for ai.acceleration_backend with implementation, security, regression and Library-contract acceptance gates.

  - id: L20
    title: Continuous autonomous chat checkpointing
    state: done
    priority: P0
    outcome: >-
      Persist material lane progress continuously during work so context exhaustion, app closure or chat rollover
      does not require a user-triggered emergency save. Checkpoints carry safe resume state, decisions, evidence
      references and the next action, renew the claim lease, and final review handoff checkpoints automatically.

  - id: L21
    title: Checkpoint freshness watchdog
    state: done
    priority: P0
    outcome: >-
      Detect claimed lanes that have not persisted a current resume checkpoint recently and surface them
      to Main/Reviewer through canonical projection, without fabricating conversation content or blocking
      legitimate external waits before claim expiry.

  - id: L22
    title: Reviewer inbox and deterministic decision transitions
    state: done
    priority: P0
    outcome: >-
      Make Main/Reviewer consume REVIEW_REQUIRED work directly from raw workstream state rather than
      relying on a potentially stale projection, enforce complete atomic worker handoffs, and provide
      explicit accept/rework transitions that preserve claim and evidence semantics.

# AIVEXUS evolutionary modular app factory — vision and evidence baseline (2026-10-11)
# This is an additive direction, not proof of end-to-end readiness.
evolution_vision:
  goal: "Offline-first modular app factory: plan -> certified reuse -> targeted generation -> isolated validation -> capture -> assemble -> deploy -> feedback -> guarded evolution."
  cost_policy: "Prefer deterministic local assembly and existing modules; use local/cloud AI only for missing capabilities, repair or quality improvements. No zero-cost guarantee."
  boundaries:
    - "One Cantiere owns project lifecycle, assembly and releases; one Library owns quarantine, certification, versioning, provenance and dependency graph."
    - "Researcher submits candidates to Library intake only; Diagnostics stores reproducible evidence and target validation receipts."
    - "Generated or downloaded code never executes with trusted writer credentials; fail closed on invalid provenance, hashes or tests."
    - "No automatic stable release without physical target validation and required reviewer gates."
    - "Preserve Flutter/shared contracts and platform-optimized adapters; do not replace the existing stack with a toy JavaScript-only builder."
  snapshot_2026_10_11:
    aivexus_base_1: "Cantiere REVIEW_REQUIRED state_version 33; PR #826 open, not merged; exact-head Web regression and platform build CI PASS, physical generated-app acceptance NOT PROVEN."
    canonical_state: "revision 157; BOOTSTRAP_ACTIVE; reviewer approval and merge not inferred."
    library: "Certification pipeline and guarded hash-pinned consumption declared active; end-to-end generated-once reused-next-app demonstration NOT PROVEN."
    researcher: "READY lane; existing discovered intake candidates require maturation and certification, not duplicate rediscovery."
    target_runtime: "S24 FE Vulkan/RAM and first-real-app runtime gates remain open; CI green is not device acceptance."
  milestones:
    - {id: EVO-01, state: planned, priority: P0, owner: cantiere, dependency: AIVEXUS-BASE-1, outcome: "Deterministic offline capability planner and certified-module lookup before generation; persist capability gaps on first detection (L2)."}
    - {id: EVO-02, state: planned, priority: P0, owner: library-researcher, dependency: EVO-01, outcome: "Capture first validated Cantiere module into quarantined intake with manifest, semantic version, provenance, hashes, dependencies, tests and platform compatibility; certify only via Library (L3)."}
    - {id: EVO-03, state: planned, priority: P0, owner: cantiere, dependency: EVO-02, outcome: "Persist project capability bill/lockfile, module versions, revision and reproducible source artifacts (L5); protect existing project restoration."}
    - {id: EVO-04, state: planned, priority: P0, owner: cantiere, dependency: EVO-03, outcome: "Prove app A creates validated module, app B reuses the certified pinned module offline without AI generation; assert deterministic hashes and diagnostics receipts."}
    - {id: EVO-05, state: planned, priority: P1, owner: library-researcher, dependency: EVO-04, outcome: "Impact graph, durable upgrade candidates, target regression tests, guarded release policy, rollback and integration feedback (L6/L7/L8/L9/L10)."}
  acceptance: "Do not claim evolutionary loop operational until EVO-04 is proven; preserve physical-device and reviewer gates for stable artifacts."
