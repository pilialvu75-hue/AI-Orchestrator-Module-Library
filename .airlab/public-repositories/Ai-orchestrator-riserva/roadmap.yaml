  title: Dipendenze e toolchain non fissate
  state: planned
  priority: P1
  source_priority: P1
  epics:
  - CANT-10
  evidence_level: Confermato
  problem: pubspec.lock non è tra i file tracciati, mp_audio_stream usa any e la CI seleziona Flutter stable senza
