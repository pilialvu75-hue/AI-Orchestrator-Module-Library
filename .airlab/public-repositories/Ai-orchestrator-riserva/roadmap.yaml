invariants:
- Cantiere remains authoritative for Project/Task/Execution/review/validation/approval/apply.
- Library reuse is checked before regeneration.
- Missing capabilities are recorded immediately for Library/Researcher while Cantiere may implement them in parallel.
- Reusable Cantiere-created capability code returns to Library intake after validation.
- Researcher code never bypasses Library quarantine/certification.
- No evolved application version becomes stable without real physical-device validation.
- Durable work must survive restart and must not require the user to type continue.
- Local mode remains useful offline; web access is optional capability, not a cloud-mode requirement.
- GPU/Vulkan claims require runtime proof.
roadmap:
- id: CANT-INF1
  title: Per-target inference optimization matrix
  state: active
  priority: P0
  outcome: >-
    Select and maintain the strongest practical stable inference profile for each hardware/software target,
    allowing different LLMs, quantizations, backends, acceleration settings and role assignments while
    preserving the shared inference/routing contract and Diagnostics evidence format.
  current_evidence:
  - Android Galaxy S24 FE is the active physical benchmark target.
  - Heavy 6.7B/7B models have demonstrated RAM-preflight safety skip behavior and must not be forced when headroom is insufficient.
  - DeepSeek-R1 reasoning-aware benchmark correction is merged via PR #740.
  - Spark-X2.5 4B Q4_K_M is accepted for the downloadable catalog; PR #744 remains open and must not be marked available on main until merged and validated.
- id: CANT-CP1
  title: Canonical multi-chat control plane and strong gates
  state: active
  priority: P0
  outcome: >-
    Coordinate Cantiere, Voice/Live, shared runtime, Diagnostics and platform-specific chats through
    one private canonical authority, unique bounded claims, strong evidence gates and Main/Reviewer consolidation.
- id: CANT-1
  title: Repository/PR convergence and clean main
  state: active
  priority: P0
  outcome: Resolve/merge/rebuild/close historical open PRs so main remains understandable.
  audit_findings:
  - CANT-AUDIT-21
- id: CANT-2
  title: Assistant local runtime stabilization
  state: active
  priority: P0
  outcome: Stable multi-turn local inference, no crashes, lower latency, correct context and continuous streaming.
  audit_findings:
  - CANT-AUDIT-05
  - CANT-AUDIT-09
  - CANT-AUDIT-10
  - CANT-AUDIT-11
- id: CANT-3
  title: Voice and live interaction
  state: active
  priority: P0
  outcome: Reliable Sherpa-ONNX STT, audible Kokoro TTS, full local/live interaction loop.
  preserved_acceptance:
  - STT remains Sherpa-ONNX streaming; downloads/install must produce one coherent encoder/decoder/joiner/tokens set.
  - Voice model downloads preserve partial files/resume and validate/extract archives atomically.
  - TTS success requires audible playback on the target, not only native creation or PLAY_BEGIN.
  - Diagnostics must expose samples/rate/peak-RMS/buffer/playback/routing evidence for silent-audio failures.
  - Voice/Live remains user-controlled until runtime stability is demonstrated; do not reintroduce crash-prone automatic speech.
  - Multilingual target remains IT/FR/EN/ES with natural offline speech quality.
