mission: >-
  Remain the primary offline-first Flutter AI Orchestrator and Cantiere application,
  coordinating local/cloud intelligence, Library reuse, project generation, durable execution
  and real artifacts without becoming dependent on one provider or a live chat session.

current_state:
  local_runtime:
    status: active
    focus: phi3_5_mini_android_vulkan_stability_latency
  cantiere:
    status: active
    recent:
      - neutral_opening_and_explicit_project_restore
      - project_identity_and_recovery_hardening
      - durable_orchestrator_v1
      - library_reuse_and_submission_paths
  researcher_code_boundary:
    status: hardened
    rule: "Researcher candidate code cannot execute directly; code crosses Library."
  voice:
    status: active_incomplete
    focus: sherpa_onnx_stt_kokoro_tts_live_interaction
  cloud:
    status: active_transition
    rule: "Provider/resource infrastructure should converge through AIrLab rather than duplicate inside Cantiere."
  desktop_platforms:
    status: active
    targets: [windows, linux, macos]
  updates:
    status: active
    focus: verified_ota_and_release_lifecycle

invariants:
  - "Cantiere remains authoritative for Project/Task/Execution/review/validation/approval/apply."
  - "Library reuse is checked before regeneration."
  - "Missing capabilities are recorded immediately for Library/Researcher while Cantiere may implement them in parallel."
  - "Reusable Cantiere-created capability code returns to Library intake after validation."
  - "Researcher code never bypasses Library quarantine/certification."
  - "No evolved application version becomes stable without real physical-device validation."
  - "Durable work must survive restart and must not require the user to type continue."
  - "Local mode remains useful offline; web access is optional capability, not a cloud-mode requirement."
  - "GPU/Vulkan claims require runtime proof."

