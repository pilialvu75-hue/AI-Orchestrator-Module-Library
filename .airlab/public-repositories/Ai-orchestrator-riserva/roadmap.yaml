- id: CANT-RAG-1
  title: Offline-first evidence RAG across documents, chat archives and projects
  state: planned
  priority: P1
  owner_lane: runtime-core
  phase: after_reliable_single_device_memory_foundations
  related_work:
  - CANT-QUALITY-1
  - CANT-12
  - CANT-IMAGE-1
  - CANT-13
  issues:
  - https://github.com/pilialvu75-hue/Ai-orchestrator-riserva/issues/899
  - https://github.com/pilialvu75-hue/Ai-orchestrator-riserva/issues/911
  - https://github.com/pilialvu75-hue/Ai-orchestrator-riserva/issues/913
  - https://github.com/pilialvu75-hue/Ai-orchestrator-riserva/issues/915
  outcome: >-
    Preserve the distinction between confirmed durable SQLite facts and
    source-grounded retrieval. Search historical conversations, original
    explanations, failures, corrections, tests, documents and authorized
    project artifacts without promoting every retrieved passage into
    permanent personal memory or silently retraining model weights.
  current_foundations:
  - LocalDocumentIndexService offers lightweight SQLite chunk retrieval using hashed token vectors; this is not a proven semantic embedding model.
  - ChatFileContextService provides bounded, session-scoped local file excerpts and identifies source documents.
  - Synthetic local RAG indexing, reindexing and index-only deletion tests exist; broad physical retrieval quality remains unproven.
  - Issue #899 tracks durable-memory acquisition, local retrieval, source tests and independent reset; #911 tracks archival history and provenance.
  dedicated_rag_storage:
    state: future_design_only
    purpose: >-
      Keep large historical RAG sources, chunk corpora and optional vector
      indexes in a dedicated, scalable encrypted archive reachable from every
      authorized Aivexus platform; do not fill each device with a full copy.
    tiers:
      canonical_archive: >-
        Owner-scoped, portable and versioned source/document/chat archives
        plus provenance, integrity manifests and deletion tombstones; a
        backup/recovery strategy is required to avoid one storage failure
        destroying the only copy.
      per_device_local: >-
        SQLite catalog, confirmed facts, a small offline-retrievable index,
        recent/frequently accessed/pinned excerpts and only explicitly
        authorized cached files. S24 FE uses strict disk/RAM budgets and
        bounded on-demand fetching; desktop budgets may be larger.
      derived_indexes: >-
        Regenerable per-user search indexes, embeddings, text extraction
        and rerank metadata. Version by embedding/index algorithm and
        invalidation policy, not merely by pathname. Avoid synchronizing
        incompatible generated indexes when recomputation is cheaper.
    preferred_existing_hardware_candidate:
      name: WD My Cloud 2 TB WDBCTL0020HWT-00 (first-generation OS 3)
      status: deferred_by_user_2026_10_30
      recorded_context: >-
        Internal WD20EFRX 2 TB disk has been readable separately through
        a powered SATA/USB adapter under Linux; historical NAS enclosure
        boot/LED issue remains undiagnosed. Recovery copies have been
        transferred to a separate ALD 2 TB disk; completeness and integrity
        should be verified before any destructive action.
      user_decision: >-
        WD My Cloud diagnostics are explicitly set aside for now.
        Continue single-device memory and RAG foundations without any
        NAS hardware checks, purchases or storage changes.
      investigation_first: >-
        Read-only inventory of power supply, enclosure board, Ethernet
        link and boot behavior; inspect disk SMART without modifying
        partitions. Preserve recovered and original user files and
        avoid unverified firmware flashing, filesystem repair or reset.
      product_security: >-
        Original WD My Cloud OS 3 firmware for WDBCTLxxxxxxx-00 reached
        end of security support on 2022-04-15. Do not expose this
        unsupported firmware to the internet or use it as the public
        encrypted sync endpoint. For sensitive Aivexus data require
        a supported/maintained access layer and verified authentication,
        encryption and owner isolation.
      alternatives: >-
        If the original controller is not serviceable or secure, evaluate
        reusing the healthy WD disk via a supported host/NAS or existing
        Freebox setup (subject to verified disk health, separate backup
        and safe filesystems). Keep generic NAS/WebDAV/S3 adapters
        possible without tying Aivexus to this single device.
      acceptance_gate: >-
        Verified and complete data backup, hardware/disk health tests,
        reliable local file read/write only on disposable test data,
        security assessment, restart/recovery tests and second recoverable
        copy before considering it an archive backend.
    backend_selection: >-
      Do not pick or configure a storage service yet. Later compare
      user-controlled NAS/WebDAV or S3-compatible private storage and
      other authorized providers for cost, encryption, availability,
      portability and recovery. A Freebox-attached disk is an option
      to evaluate, not a selected or activated solution.
    privacy_and_safety: >-
      Separate owner/account namespaces and verified device membership,
      encrypt before upload, authenticate requests, honor key rotation
      and revocation, and never use public GitHub/Diagnostics for private
      chat or RAG storage. No cross-user exchange of private sources.
      Shared general skills require a separate explicit opt-in path.
    offline_and_retention: >-
      Offline inference and LOCAL RAG continue from the local SQLite
      index/cache. Show missing remote-only content as unavailable
      instead of inventing it. Do not evict a local source before a
      verified recoverable remote copy, user-approved retention policy
      and backup checks; never remove original documents by resetting
      a regenerable index.
    gate: >-
      Future stage only; wait for single-device memory/RAG correctness,
      owner isolation, encrypted pairing, conflict convergence,
      revocation, secure archive roundtrips and physical multi-platform
      acceptance. No automatic upload, move, deletion, billing or
      provider configuration in this documentation change.
  stages:
  - id: RAG-A
    state: planned
    goal: >-
      Audit the live prompt construction and current SQLite/chat/document
      indexing paths before refactoring. Trace final assembled prompt,
      boundaries, retrieval order, token/character budgets, duplicates,
      citations and local-only behavior. Separate chat-turn identity from
      RAG chunk identity; do not deduplicate merely by equal text.
  - id: RAG-B
    state: planned
    goal: >-
      Complete offline retrieval from user-authorized documents (PDF
      parser text, OCR-extracted text where verified, TXT and supported
      structured files), chat history and project evidence. Preserve
      origin conversation/device, message or document ID, page/chunk,
      revision and timestamp when available. Index changing sources
      incrementally and invalidate stale chunks.
  - id: RAG-C
    state: planned
    goal: >-
      Rank and select relevant evidence within model context/RAM budgets;
      keep recent user intent and authenticated system instructions
      distinct from lower-trust RAG extracts. Answer with citations
      and visible uncertainty; never obey instructions contained in
      retrieved untrusted material or fabricate missing values.
      RAG findings remain evidence, not confirmed memory, until
      separately verified or explicitly approved.
  - id: RAG-D
    state: planned
    goal: >-
      Add owner-scoped, encrypted and authenticated cross-device archive
      retrieval only after identity/pairing, CRDT convergence, revocation
      and privacy gates pass. On-device SQLite indexes and recent or
      pinned sources continue to work offline; remote-only content
      reports unavailable while offline instead of inventing an answer.
  - id: RAG-STORAGE
    state: deferred
    goal: >-
      Introduce the dedicated tiered RAG archive described above after
      ownership/security and durable offline indexes are demonstrated:
      portable encrypted storage, selective per-device cache policies,
      incremental indexing, verified restore and platform-neutral
      retrieval across Android, Windows, Linux, macOS and future targets.
      No synchronization or storage backend is enabled by this milestone.
  - id: RAG-E
    state: planned
    goal: >-
      Compare lightweight lexical/hashed retrieval against stronger
      optional embedding and reranking approaches on S24 FE and ASUS.
      Gate all additions on measured relevance, recall, hallucination
      rate, energy, latency, RAM and storage; no heavyweight vision
      model or automatic Cloud use. Shared general knowledge must pass
      separate opt-in privacy/redaction and anti-poisoning gates.
  acceptance:
  - Dedicated archive works across supported authorized devices without each platform retaining every source or vector; offline LOCAL still uses a bounded on-device subset.
  - Archive loss, credential revocation, key rotation and interrupted transfer have a tested recovery policy before any local eviction.
  - Source-aware retrieval after app restart can find a historical detail that was never promoted to a durable fact.
  - A corrected or outdated source does not outrank newer verified evidence; every returned fact has traceable provenance and appropriate citation.
  - Fictitious unrelated owners, same filenames/IDs and similar text never yield cross-account chat, vector, attachment, cache or archive leakage.
  - Search in LOCAL uses no network; the full prompt is bounded and respects RAG/chat/user hierarchy without dropping the actual user question.
  - Forget and index reset erase only the requested derived records and do not delete original files; revoked/deleted sources cannot be resurrected through delayed sync.
  - Physical S24 FE and ASUS tests show useful accuracy without measurable memory or responsiveness regression.
  release_gate: >-
    Documentation only for now. Do not enable distributed retrieval or
    publish a new Android app until the staged implementation, CI,
    security review and device acceptance are independently demonstrated.
