  title: Documenti divergenti, percorsi storici e file troppo estesi
  state: planned
  priority: P2
  source_priority: P2/P3
  epics:
  - CANT-13
  evidence_level: Debito documentale e di manutenzione confermato
  problem: ARCHITECTURE_LOCK descrive un avvio diverso da main; RISERVA_SEPARATION_AUDIT non fotografa il prodotto
    attuale. Esistono una ModelsPage non collegata al percorso app, due workspace e un alias AiModel ambiguo. I
