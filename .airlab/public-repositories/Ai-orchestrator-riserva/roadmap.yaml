- id: CANT-AUDIT-20
  audit_item: 20
  title: CI onerosa e warning non bloccanti
  state: planned
  priority: P2
  source_priority: P2/P3
  epics:
  - CANT-10
  evidence_level: Costo CI misurato; ottimizzazioni da verificare
  problem: 'Il run Android esaminato dura 18m45s: APK 9m29s, AAB 1m44s, test 2m05s, CodeQL finale 2m50s. La cache
    nativa è stata ripristinata; main non contiene più flutter clean né cancellazione della .cxx nello step indicato
    da Claude. APK e AAB sono però prodotti anche sulle PR; più workflow ripetono attività. L’analyzer lascia passare
    warning/info, non gli errori: nel run c’erano 18 warning e 158 info.'
  implementation: Misurare tempi e hit rate; valutare APK sulle PR e AAB alla promozione, riutilizzare gli artefatti
    validati nei publisher e ridurre duplicazioni mantenendo i controlli necessari. Bloccare nuovi warning con una
    baseline progressiva. Verificare copertura CodeQL dopo ogni modifica della strategia di cache.
  done_when: Riduzione documentata di tempo/minuti di esecuzione senza perdita dei controlli ABI, dei test o dell’analisi
    richiesta. Non dividere APK/AAB in job paralleli senza valutare duplicazione del lavoro e costo.
  evidence_urls:
  - https://github.com/pilialvu75-hue/Ai-orchestrator-riserva/actions/runs/36318915202/job/108618819593
  - https://github.com/pilialvu75-hue/Ai-orchestrator-riserva/blob/0c1fa14c154308a03a62a6ad730d639d7ace3e65/.github/workflows/build.yml#L60
  - https://github.com/pilialvu75-hue/Ai-orchestrator-riserva/blob/0c1fa14c154308a03a62a6ad730d639d7ace3e65/.github/workflows/build.yml#L346
  - https://github.com/pilialvu75-hue/Ai-orchestrator-riserva/blob/0c1fa14c154308a03a62a6ad730d639d7ace3e65/.github/workflows/build.yml
  - https://github.com/flutter/flutter/blob/stable/packages/flutter_tools/lib/src/commands/analyze_once.dart
  measurement_required: Do not claim runtime/build savings before a controlled before/after measurement.
- id: CANT-AUDIT-21
  audit_item: 21
  title: Accumulo di branch e rischio operativo nella bonifica
  state: planned
  priority: P2
  source_priority: P2
  epics:
  - CANT-1
  evidence_level: Inventario GitHub confermato; impatto sulle prestazioni non misurato
  problem: 'Enumerate nove pagine API: 716 branch, 682 SHA di testa distinti, 20 gruppi duplicati e 34 nomi oltre
    un riferimento per gruppo. Otto branch assistant-interaction-wiring condividono c6c397f. Un altro gruppo contiene
    il branch della PR aperta #583 e rebuild/pr583-certified-library-evidence-current-main sullo stesso SHA. delete_branch_on_merge
    è false. Non sono 716 lavori tutti attivi e i branch non rallentano l’inferenza sul telefono.'
  implementation: Creare un inventario branch→SHA→PR→stato di assorbimento, conservare riferimenti canonici e lavoro
    non integrato, verificare dipendenze prima delle cancellazioni. Abilitare in seguito l’eliminazione automatica
    dopo merge; la sola chiusura di una PR non equivale al merge. Non cancellare in blocco tutti i nomi di un gruppo
    identico.
  done_when: Nessuna PR attiva o automazione perde il riferimento; nessun commit unico utile viene abbandonato.
    Un report prima/dopo documenta la bonifica; solo una misura separata può attribuire un miglioramento a clone/fetch.
  evidence_urls:
  - https://github.com/pilialvu75-hue/Ai-orchestrator-riserva/branches
  - https://api.github.com/repos/pilialvu75-hue/Ai-orchestrator-riserva
  - https://github.com/pilialvu75-hue/Ai-orchestrator-riserva/pull/583
  - https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/managing-the-automatic-deletion-of-branches

