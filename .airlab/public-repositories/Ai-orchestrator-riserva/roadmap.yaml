  already_implemented:
  - Android native model/session creation and release run off the UI isolate.
  - Android final prompt budgeting uses the native tokenizer, output reservation and explicit capacity failure.
  - Android model/voice downloads use persistent DownloadManager requests and transfer deduplication.
  - Voice DI uses Sherpa from Dart and isolate-backed Kokoro; legacy Kotlin stubs do not describe the active engine.
  - Android native cache is preserved; do not reintroduce a full clean as the default optimization.
  - Gradle configures MLC OFF and Vulkan ON; these are independent execution paths.
  - Analyzer errors remain fatal; only warnings and infos are non-fatal under the current flags.
  safeguards:
  - Do not treat a green scripted Cantiere smoke test as physical validation of real-model generation.
  - Do not mark an open PR as implemented on main or a proposed profile as physically validated.
  - Do not weaken cancellation, memory guards, review, approval/apply or Library certification boundaries.
  - 'Do not delete duplicate-head branches blindly: the group at feab579e4d5e53cd394d12521d09dca561be9c60 contains
    open PR #583''s head.'
  - Do not enable LAN sync before convergence, cursors, authentication and privacy export rules are verified.
  - Do not attribute device latency to branch count, file size, class count or MLC being disabled without execution
    evidence.
