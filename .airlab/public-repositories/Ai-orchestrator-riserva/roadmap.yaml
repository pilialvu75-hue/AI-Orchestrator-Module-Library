  recorded_at: '2026-10-29'
  authoritative_roadmap: .airlab/public-repositories/Ai-orchestrator-riserva/roadmap.yaml
  policy: >-
    Use this roadmap plus canonical-state, lane checkpoints, current repository
    commits and physical/device receipts for every operational decision.
    Do not let a public narrative roadmap or old chat override these records.
  public_companion: pilialvu75-hue/Ai-orchestrator-riserva/docs/ROADMAP_EVOLUTIVA.md
  public_companion_note: >-
    Public product narrative and phase definitions must remain consistent,
    but never copy private coordination state, user content, locks or secrets
    to a public repository. Update only the appropriate public summaries.
  current_app_main_evidence:
    - 'PR #923: image offline OCR, merged; later image text layout PR #925 merged'
    - 'PR #926: local PDF native text/scanned page handling, merged'
    - 'PR #928: compact query-directed PDF evidence, merged'
    - 'PR #929: prevent unintended document-triggered Web search, merged'
    - 'PR #930: PDF table quantity and verified single-page provenance, merged'
    - 'PR #931: native horizontally scrollable Markdown table widget, merged; six PR CI successful'
    - 'PR #932: safe collapsed one-line Markdown table recognition, merged as 71497e37 after 6/6 PR CI PASS; target physical QA pending'
    - 'Signed stable release v1.0.15+103532, build #3532, published 2026-10-29'
    - 'Current main docs evidence: 009f13a7 (S24 Markdown failure appended after release)'
  device_evidence:
    target: Samsung Galaxy S24 FE
    modality: LOCAL_airplane_mode
    model: Phi-3.5 Mini
    observed_pdf_pass: >-
      With AIVEXUS_Test_PDF_S24.pdf attached once, the model answered
      Teiera rossa (quantity 1, price 24.00 EUR, code TR-07, page 1/1),
      followed by Tazza blu (quantity 1, price 8.90 EUR, code TZ-19,
      page 1/1) without attaching the PDF again. These are two specific
      physical PASS cases, not a general proof against hallucinations.
    observed_table_fail: >-
      On stable 103532, a request to create an explicit Markdown table
      returned article, quantity, price, code and page values for three
      observed rows (The vert, Tazza blu, Teiera rossa), but Phi flattened
      header, separator and cells into one logical line; one trial also
      included a markdown code fence. The renderer only accepts real lines
      outside code fences. No rendered table was visible. Fix output
      normalization and/or opt-in instruction; never fabricate cells/pages.
    observed_image_state: >-
      Image LOCAL classifier recognized only general objects; bundled
      Latin OCR subsequently transcribed text from a French poster offline
      on S24 (103489 physical PASS for text), but a multilingual JPG table
      had broken column/row associations (layout FAIL). PR #925 spatial
      reflow is integrated, but an equivalent exact physical layout PASS
      for that new reflow is not yet recorded. This is not VLM vision.
    user_reported_performance: >-
      ASUS Windows and Galaxy S24 FE feel substantially faster than before.
      Freeze new speed-chasing experiments temporarily; retain regression
      protection in RAM, UI frame smoothness, history startup and local
      first-token latency. Do not claim measured performance deltas without
      before/after evidence.
  evidence_quality_rule: >-
    Distinguish code merged, CI green, physical functionality observed,
    and full acceptance. Tests on one PDF or one image cannot certify
    all document or visual tasks. Evidence from chats must be associated
    with the source build and device before a gate is promoted.
active_product_priorities:
  - id: P0-RESPONSE-RELIABILITY
    work_ref: CANT-QUALITY-1
    state: active
    intent: >-
      Reduce unsupported claims, wrong answers, incomplete fields,
      preceding-turn contamination, document misattribution, forced
      Web search and prompt-budget errors. Ask for uncertainty when
      source evidence is inadequate; no hidden Cloud fallback.
  - id: P0-LIGHTWEIGHT-CHAT-UI
    work_ref: CANT-UX-1
    state: active
    intent: >-
      Repair tabular output from small LOCAL models, then incrementally
      add tiny status/document icons, headings, lists, code blocks and
      links via native widgets with no heavy animations or dependencies.
      Status icons for success/failure must derive from real events, not
      from an unverified model's assertion.
  - id: P0-IMAGE-LOCAL-CORRECTNESS
    work_ref: CANT-IMAGE-1
    state: active
    intent: >-
      Confirm physical offline text recognition and table geometry layout
      using safe synthetic inputs. Keep classifier and OCR sequential and
      memory-bounded; do not add simultaneous large vision models.
  - id: PERF-SAFETY-ONLY
    work_ref: CANT-PERF-GUARD
    state: maintenance_only
    intent: >-
      Pause new speed optimization campaigns until Work is available
      again; no speed regression is permitted in any ongoing work.
  - id: P2-REAL-PROGRESS-VISUALIZATION
    work_ref: CANT-UX-3
    state: deferred
    intent: >-
      Future progress components are allowed only once underlying
      execution and checkpoints emit verifiable stage events. Never
      display fictitious completion percentages.
