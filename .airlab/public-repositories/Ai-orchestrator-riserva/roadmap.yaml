  F0:
    state: active_not_accepted
    title: Reliable single-user chat, offline local document/image tools and light UI
    acceptance: >-
      Main chat and attachment routes, context, citations, menu actions,
      model limitations, voice and OTA are verified on actual target
      devices; known hallucinations and serious regressions are bounded.
  F1:
    state: synthetic_restart_tests_pass_physical_pending
    title: Single-device durable personal memory with provenance
    acceptance: 'Synthetic store/retrieve/revise/forget, session separation and restart proof; physical restart on S24 and ASUS, UI review, privacy policy and user-facing reset still pending.'
  F2:
    state: planned
    title: One user across authorized S24, ASUS, Mac and optional Raspberry
    acceptance: 'Encrypted paired sync with conflict/revoke tests and offline continuity.'
  F3:
    state: planned
    title: Distinct fictitious profiles with complete data and credential isolation
    acceptance: 'No cross-profile leakage in SQLite, embeddings, cache, Cloud or backup.'
  F4:
    state: planned
    title: Shared general improvements while memories remain private
    acceptance: 'Verified reusable skills and diagnostics with privacy redaction.'
  F5:
    state: deferred
    title: Distribution to external users and future 1.0.16
    acceptance: 'Owner approval after F0-F4 and security/privacy/install gates.'
