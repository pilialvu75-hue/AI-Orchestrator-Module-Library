lifecycle:
  status: active
  role: shared_public_sanitized_diagnostics_sink

mission: >-
  Preserve privacy-safe technical evidence from app, Library and Researcher producers,
  enabling incident analysis and correlation without exposing conversations, prompts, source
  payloads, credentials or personal data.

current_state:
  app_namespace: active
  library_namespace: defined
  researcher_namespace: defined
  event_schema_v2: active
  storage: github_releases_and_assets
  local_app_opt_in: required

invariants:
  - "Public diagnostics contain only filtered technical metadata."
  - "Never publish credentials, prompts, conversations, source payloads, cookies or unrestricted paths."
  - "Each producer rotates only its own release/assets."
  - "Delivery is acknowledged only after required remote writes are verified."
  - "Historical event origin is distinguished from the build that later collected it."
  - "Strong/user-visible incident escalation is separate from ordinary telemetry volume."

