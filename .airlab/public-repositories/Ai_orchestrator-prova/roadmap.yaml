    title: Real provider adapters and authenticated health/quota probes
    state: active
    priority: P0
  - id: AIR-2
    title: Shared Dart-side capability/resource adapter for Cantiere
    state: planned
    priority: P0
  - id: AIR-3
    title: Wire real Module Library, Researcher and Diagnostics adapters
    state: planned
    priority: P0
  - id: AIR-4
    title: Normalize quota/reset/freshness end to end
    state: planned
    priority: P0
  - id: AIR-5
    title: Durable external-event correlation with Cantiere
    state: active
    priority: P0
  - id: AIR-6
    title: Atomic distributed orchestration storage
    state: planned
    priority: P1
  - id: AIR-7
    title: build.web worker and repeatable 0 EUR web MVP
    state: planned
    priority: P1
  - id: AIR-8
    title: Extend build workers to Android/desktop after web reliability
    state: planned
    priority: P1
  - id: AIR-9
    title: Naming/repository identity decision
    state: pending_owner_decision
    priority: P2

  - id: AIR-10
    title: Canonical roadmap executor and lane dispatcher
    state: planned
