schema_version: 1
repository: pilialvu75-hue/Ai_orchestrator-prova
visibility: public
roadmap_storage: private_library
updated_at: 2026-10-01
baseline_commit: 519cff2f551ae91b2b84c6fae8362a93bd0a6378

lifecycle:
  status: active
  role: airlab_control_and_execution_plane

mission: >-
  Provide provider-neutral capability execution, routing, shared memory/resource state and
  remote worker infrastructure for Cantiere while never creating a second project lifecycle.

current_state:
  historical_chat_recovery:
    status: consolidated_2026_10_01
    rule: Old AIrLab/Web chat relays are superseded by this roadmap plus the canonical airlab/platform-web lanes.
  architecture_v1: merged
  deterministic_mock: active_contract_oracle
  intelligence_gateway: implemented_v1
  memory_fabric: implemented_v1
  free_resource_pool: implemented_v1_core
  resource_gateway_convergence: merged
  cloudflare_worker: active_staging_adapter
  real_provider_execution: incomplete
  library_adapter: null_in_worker
  researcher_adapter: null_in_worker
  diagnostics_adapter: partial
  durable_orchestrator_authority: cantiere_parent
  budget_default: "0 EUR/month"

invariants:
  - "AIrLab is an orchestrator/control plane, not a single model runtime."
  - "Capabilities are stable; providers are replaceable."
  - "Cantiere owns Project/Task/Execution/review/approval/apply."
  - "AIrLab cannot write directly to the real Cantiere repository/workspace."
  - "Free-first/spend-safe policy is explicit; paid fallback requires authorization."
  - "Memory Fabric adds backends; it does not replace local memory."
  - "Cloudflare is an adapter, not an architectural dependency."
  - "Diagnostics exclude raw prompts, source payloads and secrets."

