name: Test next unadmitted upstream Dart package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-next-external-dart-upstream.yml'
      - 'tools/select_next_external_dart_package.py'
      - 'examples/async_adapter_consumer/**'
  pull_request:
    paths:
      - '.github/workflows/test-next-external-dart-upstream.yml'
      - 'tools/select_next_external_dart_package.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  next-upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Discover upstream modules at real pinned commit
        run: python3 tools/discover_external_dart_packages.py --output "$RUNNER_TEMP/discovery.json"
      - name: Select next candidate not already admitted
        run: python3 tools/select_next_external_dart_package.py --discovery "$RUNNER_TEMP/discovery.json" --intake intake --output "$RUNNER_TEMP/next.json"
      - name: Acquire pinned upstream repository and execute real package tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/next.json" "$RUNNER_TEMP" <<'PY'
          import json, pathlib, subprocess, sys
          data=json.load(open(sys.argv[1]))
          root=pathlib.Path(sys.argv[2])
          assert data["status"]=="DISCOVERED_UNTESTED"
          subprocess.run(["git","clone","--quiet","--filter=blob:none","https://github.com/dart-lang/core",str(root/"upstream")],check=True)
          subprocess.run(["git","-C",str(root/"upstream"),"checkout","--quiet",data["source_commit"]],check=True)
          target=root/"upstream"/data["source_path"]
          assert target.is_dir() and (target/"pubspec.yaml").is_file()
          print("NEXT_UPSTREAM_TEST_TARGET",data["package"],data["source_commit"],flush=True)
          PY
          package_path="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["source_path"])' "$RUNNER_TEMP/next.json")"
          cd "$RUNNER_TEMP/upstream/$package_path"
          dart pub get
          dart analyze
          dart test
          echo "PASS: real upstream Dart package tests"
          python3 - "$RUNNER_TEMP/next.json" "$RUNNER_TEMP/next-upstream-test-receipt.json" <<'PY'
          import json, pathlib, sys
          candidate = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert candidate["status"] == "DISCOVERED_UNTESTED"
          receipt = {
              "schema": "aivexus.library.upstream-test-receipt.v1",
              "package": candidate["package"],
              "source_commit": candidate["source_commit"],
              "source_path": candidate["source_path"],
              "upstream_pub_get": "PASS",
              "upstream_analyze": "PASS",
              "upstream_test": "PASS",
              "independent_consumer": "NOT_RUN",
              "packaged_adapter": "NOT_BUILT",
              "admission_authorized": False,
              "certification_authorized": False,
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt))
          PY
      - name: Execute independent public API smoke consumer for selected package
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_next_external_dart_consumer.py --candidate "$RUNNER_TEMP/next.json" --upstream "$RUNNER_TEMP/upstream" --output "$RUNNER_TEMP/next-consumer" --receipt "$RUNNER_TEMP/next-consumer-receipt.json"
          cd "$RUNNER_TEMP/next-consumer"
          dart pub get
          dart analyze
          dart run bin/main.dart
          python3 - "$RUNNER_TEMP/next-consumer-receipt.json" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          receipt = json.loads(p.read_text())
          receipt["independent_consumer"] = ("BEHAVIOR_PASS" if receipt["behavior_tested"] else "IMPORT_SMOKE_PASS")
          p.write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - name: Package and execute independent AIVEXUS adapter consumer for async
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          selected="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["package"])' "$RUNNER_TEMP/next.json")"
          if [ "$selected" != "async" ]; then
            echo "No packaged adapter contract for $selected; leave admission unauthorized"
            exit 0
          fi
          python3 tools/build_next_external_dart_adapter.py --candidate "$RUNNER_TEMP/next.json" --upstream "$RUNNER_TEMP/upstream" --output "$RUNNER_TEMP/async-adapter" --receipt "$RUNNER_TEMP/async-adapter-receipt.json"
          mkdir -p "$RUNNER_TEMP/adapter-consumer/bin"
          cat > "$RUNNER_TEMP/adapter-consumer/pubspec.yaml" <<EOF
          name: aivexus_async_adapter_consumer
          publish_to: none
          environment:
            sdk: ^3.4.0
          dependencies:
            aivexus_external_async:
              path: $RUNNER_TEMP/async-adapter
          EOF
          cp examples/async_adapter_consumer/bin/main.dart "$RUNNER_TEMP/adapter-consumer/bin/main.dart"
          cd "$RUNNER_TEMP/adapter-consumer"
          dart pub get
          dart analyze
          dart run bin/main.dart
          python3 - "$RUNNER_TEMP/async-adapter-receipt.json" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          receipt=json.loads(p.read_text())
          receipt["status"]="PACKAGED_CONSUMER_PASS"
          receipt["admission_authorized"]=False
          p.write_text(json.dumps(receipt,indent=2)+"\n")
          PY
      - name: Verify evidence before TESTED intake review
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/async-adapter-receipt.json" ]; then
            python3 tools/verify_next_async_admission.py \
              --upstream "$RUNNER_TEMP/next-upstream-test-receipt.json" \
              --consumer "$RUNNER_TEMP/next-consumer-receipt.json" \
              --adapter "$RUNNER_TEMP/async-adapter-receipt.json" \
              --output "$RUNNER_TEMP/async-tested-intake-review.json"
          fi
      - name: Publish verified AIVEXUS async adapter bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aivexus-async-tested-adapter-not-admitted
          path: |
            ${{ runner.temp }}/async-adapter/
            ${{ runner.temp }}/async-adapter-receipt.json
            ${{ runner.temp }}/async-tested-intake-review.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish discovery and test target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-upstream-dart-test-target
          path: |
            ${{ runner.temp }}/discovery.json
            ${{ runner.temp }}/next.json
            ${{ runner.temp }}/next-upstream-test-receipt.json
            ${{ runner.temp }}/next-consumer-receipt.json
            ${{ runner.temp }}/async-adapter-receipt.json
          retention-days: 14
