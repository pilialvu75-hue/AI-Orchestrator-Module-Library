name: Prepare async independent review evidence
on:
  push:
    branches: [main]
    paths:
      - 'tools/async_independent_review_packet.py'
      - 'intake/utility.async_stream_queue.external.dartlang.async/**'
      - '.github/workflows/prepare-async-independent-review.yml'
  pull_request:
    paths:
      - 'tools/async_independent_review_packet.py'
      - '.github/workflows/prepare-async-independent-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve pinned candidate dependencies in disposable copy
        shell: bash
        run: |
          set -euo pipefail
          source="intake/utility.async_stream_queue.external.dartlang.async/0.1.0/payload/src"
          mkdir -p "$RUNNER_TEMP/async-dependency-resolution"
          cp -a "$source/." "$RUNNER_TEMP/async-dependency-resolution/"
          cd "$RUNNER_TEMP/async-dependency-resolution"
          dart pub get
          test -s pubspec.lock
          dart pub deps --json > "$RUNNER_TEMP/async-resolved-dependencies.json"
          cp pubspec.lock "$RUNNER_TEMP/async-resolved-pubspec.lock"
          python3 - "$RUNNER_TEMP/async-resolved-dependencies.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          packages=d.get("packages")
          assert isinstance(packages,list) and packages
          names={p["name"] for p in packages}
          assert {"async","collection","meta"}.issubset(names)
          print("PASS: resolved dependency graph includes async, collection, meta")
          PY
      - name: Run Dart dependency advisory audit without authorizing review
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/async-dependency-resolution"
          set +e
          dart pub outdated --json > "$RUNNER_TEMP/async-outdated.json" 2> "$RUNNER_TEMP/async-outdated.stderr"
          outdated_rc=$?
          dart pub audit --json > "$RUNNER_TEMP/async-advisory-audit.json" 2> "$RUNNER_TEMP/async-advisory-audit.stderr"
          audit_rc=$?
          set -e
          python3 - "$RUNNER_TEMP" "$outdated_rc" "$audit_rc" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          summary={
            "schema":"aivexus.library.async-advisory-audit-execution.v1",
            "outdated_exit_code":int(sys.argv[2]),
            "audit_exit_code":int(sys.argv[3]),
            "security_reviewed":False,
            "certification_authorized":False,
          }
          for label in ("outdated","advisory-audit"):
              path=root/("async-"+label+".json")
              try:
                  parsed=json.loads(path.read_text())
                  summary[label+"_json_valid"]=isinstance(parsed,dict)
              except (ValueError,OSError):
                  summary[label+"_json_valid"]=False
          summary["advisory_scan_completed"]=(summary["audit_exit_code"]==0
              and summary["advisory-audit_json_valid"])
          (root/"async-advisory-audit-status.json").write_text(
              json.dumps(summary,sort_keys=True,indent=2)+"\\n")
          print(json.dumps(summary,sort_keys=True))
          PY
      - name: Validate exact source and prepare unsigned evidence
        run: |
          set -euo pipefail
          python3 tools/async_independent_review_packet.py --root . --output "$RUNNER_TEMP/async-review-request.json"
          python3 - "$RUNNER_TEMP/async-review-request.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p["security_reviewed"] is False
          assert p["certification_authorized"] is False
          assert p["sbom_complete"] is False
          assert p["source"]["file_inventory"]
          print("PASS: unsigned review packet; independent sign-off still required")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: async-unsigned-independent-review-request
          path: |
            ${{ runner.temp }}/async-review-request.json
            ${{ runner.temp }}/async-resolved-dependencies.json
            ${{ runner.temp }}/async-resolved-pubspec.lock
            ${{ runner.temp }}/async-outdated.json
            ${{ runner.temp }}/async-outdated.stderr
            ${{ runner.temp }}/async-advisory-audit.json
            ${{ runner.temp }}/async-advisory-audit.stderr
            ${{ runner.temp }}/async-advisory-audit-status.json
          retention-days: 14
