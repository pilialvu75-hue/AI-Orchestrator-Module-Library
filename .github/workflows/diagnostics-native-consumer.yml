name: Diagnostics isolated native consumer
on:
  pull_request:
    paths:
      - 'packages/aivexus_original_diagnostics/**'
      - '.github/workflows/diagnostics-native-consumer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Generate isolated test application
        run: python packages/aivexus_original_diagnostics/consumer-smoke/prepare.py ${{ matrix.platform }}
      - name: Analyze consumer
        working-directory: diagnostics-smoke
        run: |
          flutter pub get
          flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Compile Android test APK
        if: matrix.platform == 'android'
        working-directory: diagnostics-smoke
        run: flutter build apk --debug
      - name: Compile Windows test application
        if: matrix.platform == 'windows'
        working-directory: diagnostics-smoke
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'android'
        with:
          name: diagnostics-qa-android-debug
          path: diagnostics-smoke/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: diagnostics-qa-windows
          path: diagnostics-smoke/build/windows/x64/runner/Release/
          if-no-files-found: error
