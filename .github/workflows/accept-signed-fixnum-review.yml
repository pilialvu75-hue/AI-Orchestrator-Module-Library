name: Accept independent signed fixnum review and stage certification

on:
  push:
    branches: [main]
    paths:
      - 'review-submissions/utility.int64_arithmetic.external.dartlang.fixnum/0.1.0/**'
  workflow_dispatch:

# Only trusted Library metadata tools run with a write token; never execute
# candidate Dart code in this job. The independent signature is mandatory.
permissions:
  contents: read

# Serialize with the existing Library promotion workflow.
concurrency:
  group: module-library-certification-main
  cancel-in-progress: false

jobs:
  verify-stage-promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      LIBRARY_SECURITY_REVIEW_PUBLIC_KEY_PEM: ${{ vars.LIBRARY_SECURITY_REVIEW_PUBLIC_KEY_PEM }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: false

      - name: Refuse certification while main lacks GitHub branch protection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PROTECTED="$(gh api "/repos/${GITHUB_REPOSITORY}/branches/main" --jq '.protected')"
          test "$PROTECTED" = "true" || {
            echo "BLOCKED: main is unprotected; independent reviewer code can be changed without governance"
            exit 1
          }

      - name: Require independently configured reviewer trust anchor
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LIBRARY_SECURITY_REVIEW_PUBLIC_KEY_PEM:-}" || {
            echo "BLOCKED: independent reviewer public key not configured"
            exit 1
          }

      - name: Authenticate exact review and stage TESTED intake
        shell: bash
        run: |
          set -euo pipefail
          ROOT="review-submissions/utility.int64_arithmetic.external.dartlang.fixnum/0.1.0"
          test -s "$ROOT/sbom.json"
          test -s "$ROOT/independent-attestation.json"
          python3 tools/library_signed_review_stage.py \
            --root . \
            --asset-id utility.int64_arithmetic.external.dartlang.fixnum \
            --version 0.1.0 \
            --sbom "$ROOT/sbom.json" \
            --attestation "$ROOT/independent-attestation.json" \
            --output-dir "$RUNNER_TEMP/verified-review" \
            --apply

      - name: Verify exact candidate and promote under the same trusted job
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/library_pipeline.py promote \
            utility.int64_arithmetic.external.dartlang.fixnum 0.1.0 --dry-run
          python3 tools/library_pipeline.py promote \
            utility.int64_arithmetic.external.dartlang.fixnum 0.1.0
          # GITHUB_TOKEN commits cannot trigger a second push workflow.
          # Export certified packages here, before committing, to avoid an
          # unverified TESTED intermediate state on main.
          python3 tools/library_autopilot.py --report "$RUNNER_TEMP/autopilot.json"

      - name: Validate catalog, package export and signed evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_library.py
          python3 tools/validate_history.py
          python3 tools/validate_lifecycle.py
          python3 tools/validate_snapshot.py catalog/offline-snapshot.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          pin = 'utility.int64_arithmetic.external.dartlang.fixnum@0.1.0'
          index = json.loads(Path('packages/index.json').read_text())
          matches = [p for p in index.get('packages', []) if p.get('pin') == pin]
          assert len(matches) == 1, 'certified fixnum was not exported'
          path = Path(matches[0]['path'])
          assert path.is_file() and path.is_relative_to('packages')
          package = json.loads(path.read_text())['package']
          assert package['pin'] == pin and package['availability'] == 'active'
          files = {f['target_path'] for f in package['files']}
          assert {'pubspec.yaml', 'tool/self_test.dart', 'lib/aivexus_external.dart'} <= files
          module = json.loads(Path(
              'modules/utility.int64_arithmetic.external.dartlang.fixnum/0.1.0/manifest.json'
          ).read_text())
          assert module['status'] == 'certified' and module['security']['reviewed'] is True
          print('PASS: signed source promoted, exported and eligible for isolated consumer proof')
          PY

      - name: Commit verified certified package and catalog
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- catalog modules intake packages
          test -n "$(git diff --cached --name-only)" || {
            echo "BLOCKED: no certified package or catalog changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "library: certify independently approved fixnum and export package"
          git push origin HEAD:main

# A separate workflow_run consumer checks the actual exported package without
# write credentials. A signed review never serves as consumer execution proof.
