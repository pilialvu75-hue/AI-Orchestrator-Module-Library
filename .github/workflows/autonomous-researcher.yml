name: Autonomous Researcher

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: module-library-autonomous-researcher
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Select one bounded first-party candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/autonomous_researcher.py | tee /tmp/autonomous-researcher.json
      - name: Validate Library before publishing discovery
        run: |
          python tools/validate_library.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit discovered intake only
        shell: bash
        run: |
          set -euo pipefail
          # Materialization creates new, untracked intake paths. Stage first so the
          # eligibility check sees both new files and modifications.
          git add -- intake
          if git diff --cached --quiet -- intake; then
            echo "No eligible candidate discovered."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "researcher: discover bounded first-party intake candidate"
          git push origin HEAD:main
      - name: Publish discovery summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Autonomous Researcher"
            echo
            echo "- event: ${{ github.event_name }}"
            echo "- run_id: ${{ github.run_id }}"
            echo "- main_sha: $(git rev-parse HEAD)"
            if [ -s /tmp/autonomous-researcher.json ]; then
              echo "- result:"
              echo '~~~json'
              cat /tmp/autonomous-researcher.json
              echo
              echo '~~~'
            else
              echo "- result: discovery report missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: autonomous-researcher-discovery-${{ github.run_id }}
          path: /tmp/autonomous-researcher.json
          if-no-files-found: warn
          retention-days: 14
