name: Independent review handoff for autonomously TESTED public modules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fixnum-separate-consumer.yml'
      - 'tools/autonomous_public_dart_review.py'
      - 'tools/autonomous_public_dart_osv_scan.py'
      - 'tools/library_review_evidence_crosscheck.py'
      - 'tools/library_independent_review_preflight.py'
      - 'tools/library_independent_dart_static_audit.py'
      - 'tests/test_library_independent_dart_static_audit.py'
      - 'tests/test_library_static_findings_preflight.py'
      - 'tests/test_library_independent_review_preflight.py'
      - 'tests/test_library_review_evidence_crosscheck.py'
      - 'tests/test_autonomous_public_dart_osv_scan.py'
      - '.github/workflows/review-autonomous-public-dart.yml'
  workflow_run:
    workflows:
      - Admit autonomous Researcher source as real TESTED Library intake
      - Pilot fixnum in a separate Dart consumer (TESTED only)
    types: [completed]
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-independent-source-review-handoff
  cancel-in-progress: true

jobs:
  source-bound-review-packet:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted Library main without saved credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          submodules: false

      - name: Verify immutable source, original license, real CI and review-request code
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_autonomous_public_dart_review.py -v
          python3 -m unittest discover -s tests -p test_autonomous_public_dart_osv_scan.py -v
          python3 -m unittest discover -s tests -p test_library_review_evidence_crosscheck.py -v
          python3 -m unittest discover -s tests -p test_library_independent_review_preflight.py -v
          python3 -m unittest discover -s tests -p test_library_independent_dart_static_audit.py -v
          python3 -m unittest discover -s tests -p test_library_static_findings_preflight.py -v
          python3 tools/autonomous_public_dart_review.py --root . \
            --output "$RUNNER_TEMP/autonomous-researcher-review-REQUEST.json"
          python3 tools/autonomous_public_dart_osv_scan.py \
            --requests "$RUNNER_TEMP/autonomous-researcher-review-REQUEST.json" \
            --output "$RUNNER_TEMP/autonomous-researcher-osv-EVIDENCE.json"
          python3 tools/library_independent_dart_static_audit.py \
            --root . \
            --requests "$RUNNER_TEMP/autonomous-researcher-review-REQUEST.json" \
            --output "$RUNNER_TEMP/independent-dart-static-audit-EVIDENCE.json"
          python3 tools/library_independent_review_preflight.py \
            --requests "$RUNNER_TEMP/autonomous-researcher-review-REQUEST.json" \
            --evidence "$RUNNER_TEMP/autonomous-researcher-osv-EVIDENCE.json" \
            --static-audit "$RUNNER_TEMP/independent-dart-static-audit-EVIDENCE.json" \
            --output "$RUNNER_TEMP/independent-review-preflight-BLOCKED.json"
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from library_review_evidence_crosscheck import verify
          temp = Path(os.environ["RUNNER_TEMP"])
          requests = json.loads((temp / "autonomous-researcher-review-REQUEST.json").read_text())
          evidence = json.loads((temp / "autonomous-researcher-osv-EVIDENCE.json").read_text())
          print("Cross-checked unsigned review evidence:", verify(requests, evidence))
          PY
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "autonomous-researcher-review-REQUEST.json"
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["certification_authorized"] is False
          for item in report["requests"]:
              assert item["status"] == "INDEPENDENT_REVIEW_REQUIRED"
              assert item["security_reviewed"] is False
              assert item["reviewer_signature_present"] is False
              assert item["dependency_inventory"]["live_advisory_or_vulnerability_scan_completed"] is False
          temp = Path(os.environ["RUNNER_TEMP"])
          preflight = json.loads((temp / "independent-review-preflight-BLOCKED.json").read_text())
          audit = json.loads((temp / "independent-dart-static-audit-EVIDENCE.json").read_text())
          osv = json.loads((temp / "autonomous-researcher-osv-EVIDENCE.json").read_text())
          assert len(preflight["items"]) == len(audit["items"]) == len(osv["reports"]) == report["count"]
          lines = [f"Source-bound independent review requests: {report['count']}"]
          for request, gate, static, advisory in zip(report["requests"], preflight["items"], audit["items"], osv["reports"]):
              assert request["asset_id"] == gate["asset_id"] == static["asset_id"] == advisory["asset_id"]
              assert gate["decision"] == "BLOCKED" and gate["certification_authorized"] is False
              lines.append(f"{request['asset_id']}: BLOCKED; static findings={len(static['findings'])}; OSV advisories={advisory['vulnerabilities_found']}; blockers={','.join(gate['reasons'])}")
          lines.append("OSV and static audit evidence are NOT independent reviewer approval or production authorization.")
          (temp / "review-summary.txt").write_text("\n".join(lines) + "\n")
          saved_lines = (temp / "review-summary.txt").read_text().splitlines()
          assert saved_lines == lines, "review summary must preserve one line per decision"
          PY

      - name: Publish source-bound independent audit requests (never sign)
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-public-dart-independent-review-REQUEST-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/autonomous-researcher-review-REQUEST.json
            ${{ runner.temp }}/review-summary.txt
            ${{ runner.temp }}/autonomous-researcher-osv-EVIDENCE.json
            ${{ runner.temp }}/independent-review-preflight-BLOCKED.json
            ${{ runner.temp }}/independent-dart-static-audit-EVIDENCE.json
          if-no-files-found: error
          retention-days: 14
