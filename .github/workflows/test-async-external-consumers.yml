name: Test async adapter in external consumers across desktop OS
on:
  pull_request:
    paths:
      - '.github/workflows/test-async-external-consumers.yml'
      - 'intake/utility.async_stream_queue.external.dartlang.async/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-async-external-consumers.yml'
      - 'intake/utility.async_stream_queue.external.dartlang.async/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Create independent Dart consumer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path 'intake/utility.async_stream_queue.external.dartlang.async/0.1.0/payload/src').Path.Replace('\\','/')
          $consumer = Join-Path $env:RUNNER_TEMP 'async-independent-consumer'
          New-Item -ItemType Directory -Force (Join-Path $consumer 'bin') | Out-Null
          @"
          name: async_external_consumer_smoke
          publish_to: none
          environment:
            sdk: ^3.4.0
          dependencies:
            aivexus_external_async:
              path: '$source'
          "@ | Set-Content (Join-Path $consumer 'pubspec.yaml')
          @'
          import 'dart:async';
          import 'package:aivexus_external_async/aivexus_external.dart';
          Future<void> main() async {
            final q = StreamQueue<int>(Stream<int>.fromIterable([4, 7, 11]));
            try {
              if (await q.next != 4) throw StateError('first');
              if (await q.peek != 7) throw StateError('peek');
              if (await q.next != 7) throw StateError('next');
              if (await q.next != 11) throw StateError('last');
              if (await q.hasNext) throw StateError('exhaustion');
              print('PASS: independent external Dart consumer');
            } finally {
              await q.cancel();
            }
          }
          '@ | Set-Content (Join-Path $consumer 'bin/main.dart')
          Push-Location $consumer
          try {
            dart pub get
            if ($LASTEXITCODE -ne 0) { throw 'pub get failed' }
            dart run bin/main.dart
            if ($LASTEXITCODE -ne 0) { throw 'external consumer failed' }
          } finally {
            Pop-Location
          }
