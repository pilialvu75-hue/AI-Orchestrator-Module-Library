name: Plan Independent AI Orchestrator Work

on:
  workflow_dispatch:
  schedule:
    - cron: "29 * * * *"
  push:
    branches: ["main"]
    paths:
      - ".airlab/control-plane/workstreams/**"
      - ".airlab/control-plane/work-queue.json"
      - "tools/plan_parallel_work.py"
      - "tools/generate_coordinator_plan.py"

permissions:
  contents: read

concurrency:
  group: nonblocking-work-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate independent work proposal
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_coordinator_queue.py \
            --root . \
            --queue .airlab/control-plane/work-queue.json \
            --output coordinator-queue-audit.json
          python tools/generate_coordinator_plan.py \
            --root . \
            --queue .airlab/control-plane/work-queue.json \
            --output coordinator-plan.json
          python tools/gate_coordinator_assignments.py \
            --plan coordinator-plan.json \
            --audit coordinator-queue-audit.json \
            --output coordinator-eligibility-gate.json
          python tools/prepare_coordinator_claims.py \
            --root . \
            --queue .airlab/control-plane/work-queue.json \
            --plan coordinator-plan.json \
            --output coordinator-claim-proposals.json
          python tools/resolve_coordinator_workers.py \
            --root . \
            --proposals coordinator-claim-proposals.json \
            --output coordinator-dispatch.json
          python tools/reconcile_coordinator_dispatch.py \
            --root . \
            --proposals coordinator-claim-proposals.json \
            --output coordinator-dispatch-receipts.json
          python -m unittest discover -s tests -p 'test_*coordinator*.py' -v
          python -m unittest discover -s tests -p test_reconcile_coordinator_dispatch.py -v
          python -m unittest discover -s tests -p test_validate_coordinator_queue.py -v
          python -m unittest discover -s tests -p test_gate_coordinator_assignments.py -v
          python -m unittest discover -s tests -p test_resolve_coordinator_workers.py -v
          python -m unittest discover -s tests -p test_plan_parallel_work.py -v
      - name: Upload advisory plan
        uses: actions/upload-artifact@v4
        with:
          name: coordinator-plan
          path: |
            coordinator-plan.json
            coordinator-queue-audit.json
            coordinator-eligibility-gate.json
            coordinator-claim-proposals.json
            coordinator-dispatch.json
            coordinator-dispatch-receipts.json
          retention-days: 7
