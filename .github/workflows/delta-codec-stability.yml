name: Delta Codec isolated stability
on:
  pull_request:
    paths:
      - '.github/workflows/delta-codec-stability.yml'
      - 'tests/delta_codec/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
      - name: Run isolated stability tests
        working-directory: tests/delta_codec
        run: dart run stability.dart
