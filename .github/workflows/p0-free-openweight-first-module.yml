name: P0 free open-weight module generation with real independent consumer

on:
  pull_request:
    paths:
      - 'tools/generate_local_ollama_candidate.py'
      - 'tools/run_real_llm_module_trials.py'
      - 'tools/select_next_llm_trials.py'
      - 'examples/real-llm-module-trials.json'
      - '.github/workflows/p0-free-openweight-first-module.yml'
  push:
    branches: [main]
    paths:
      # Changes to the TESTED publisher must be followed by a fresh
      # credential-free real-model run so publish failures are actually fixed.
      - '.github/workflows/p0-admit-verified-llm-tested.yml'
      - 'tools/generate_local_ollama_candidate.py'
      - 'tools/run_real_llm_module_trials.py'
      - 'tools/select_next_llm_trials.py'
      - 'examples/real-llm-module-trials.json'
      - '.github/workflows/p0-free-openweight-first-module.yml'
  workflow_dispatch:
  schedule:
    # Bounded unattended growth: up to two new modules every eight hours.
    # Missing-pins selector skips existing intake; Ollama never runs for an
    # exhausted backlog, and production signature gates stay unchanged.
    - cron: '17 6,14,22 * * *'

# Runs only on a standard Linux runner in a PUBLIC repository (GitHub's
# documented zero-cost tier). No hosted paid models, secrets, write token,
# deployment or app installation; model-generated code is untrusted.
permissions:
  contents: read

concurrency:
  group: aivexus-p0-free-openweight-module-generation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify P0 model runner and independent consumer contracts
        run: |
          python3 -m py_compile tools/generate_local_ollama_candidate.py tools/run_real_llm_module_trials.py tools/select_next_llm_trials.py
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from run_real_llm_module_trials import read_trials
          trials = read_trials(Path("examples/real-llm-module-trials.json"))
          assert len(trials) >= 2
          print(f"Trusted backlog contains {len(trials)} modules; selection, not the model, decides independent acceptance contracts.")
          PY

  select-new-trials:
    needs: contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      count: ${{ steps.choose.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Choose up to two unadmitted model contracts (rotate failed retries)
        id: choose
        shell: bash
        env:
          ROTATE: ${{ github.event_name == 'schedule' && github.run_number || 0 }}
        run: |
          set -euo pipefail
          python3 tools/select_next_llm_trials.py \
            --root . --offset "$ROTATE" --batch 2 \
            --output "$RUNNER_TEMP/selected-trials.json"
          count="$(python3 -c "import json,os; print(len(json.load(open(os.environ['RUNNER_TEMP']+'/selected-trials.json'))['trials']))")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Unadmitted contracts selected for real inference: $count"
      - name: Preserve exact selected contracts for isolated builder and trusted publisher
        uses: actions/upload-artifact@v4
        with:
          name: p0-free-openweight-selected-trials
          path: ${{ runner.temp }}/selected-trials.json
          if-no-files-found: error
          retention-days: 7

  real-model-and-consumers:
    needs: [contract, select-new-trials]
    if: >-
      github.event_name != 'pull_request' &&
      needs.select-new-trials.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read exact selected public contract (no model writes)
        uses: actions/download-artifact@v4
        with:
          name: p0-free-openweight-selected-trials
          path: ${{ runner.temp }}/selection
      - run: python3 tools/select_next_llm_trials.py --root . --verify "$RUNNER_TEMP/selection/selected-trials.json"
      - uses: dart-lang/setup-dart@v1
      - name: Install Ollama and start loopback-only model server
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh -o "$RUNNER_TEMP/ollama-install.sh"
          sh "$RUNNER_TEMP/ollama-install.sh"
          export OLLAMA_HOST=127.0.0.1:11434
          ollama serve > "$RUNNER_TEMP/ollama-server.log" 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:11434/api/tags >/dev/null
          ollama --version
          ollama pull qwen2.5-coder:3b
          ollama show qwen2.5-coder:3b
      - name: Generate up to two missing Dart modules with genuine local Qwen inference
        env:
          MODULE_LLM_LOCAL: ollama
        run: |
          python3 tools/run_real_llm_module_trials.py \
            --spec "$RUNNER_TEMP/selection/selected-trials.json" \
            --output "$RUNNER_TEMP/generated" --generate
      - name: Run model's Dart tests plus separate independent Dart apps
        env:
          MODULE_LLM_LOCAL: ollama
        run: |
          python3 tools/run_real_llm_module_trials.py \
            --spec "$RUNNER_TEMP/selection/selected-trials.json" \
            --output "$RUNNER_TEMP/generated" \
            --report "$RUNNER_TEMP/p0-local-consumer-report.json" --verify
      - name: Preserve actual generated source and unvalidated metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-free-openweight-dart-source
          path: ${{ runner.temp }}/generated/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve real consumer evidence or explicit failure reason
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-free-openweight-consumer-report
          path: ${{ runner.temp }}/p0-local-consumer-report.json
          if-no-files-found: ignore
          retention-days: 7

  # Receipt only; this job never runs model code and cannot access inference
  # credentials. It makes real push/schedule results visible in issue #324.
  publish-result-receipt:
    if: always() && github.event_name != 'pull_request'
    needs: [contract, select-new-trials, real-model-and-consumers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.real-model-and-consumers.result }}';
            const run = context.runId;
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run}`;
            const marker = status === 'success'
              ? 'SUCCESS: at least one original generated module passed Dart tests and its independent consumer; inspect report for any BLOCKED second module'
              : 'BLOCKED: no two-module PASS evidence; inspect the workflow logs';
            const message = [
              '### P0 real local-model execution receipt (#324)',
              `Workflow run: ${url}`,
              `Result: **${status}** — ${marker}`,
              'Inference: Qwen2.5-Coder 3B via loopback Ollama on a public standard runner (no paid API).',
              'Builder is TESTED-IN-ISOLATION; separate publisher/consumer workflows handle internal-development availability. No production certification or automatic app installation.'
            ].join('\n\n');
            await github.rest.issues.createComment({
              ...context.repo, issue_number: 324, body: message
            });
