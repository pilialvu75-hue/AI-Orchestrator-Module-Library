name: Reconcile Canonical Control Plane

on:
  push:
    branches: ["main"]
    paths:
      - ".airlab/control-plane/workstreams/**"
      - ".airlab/control-plane/inbox/pending/**"
      - ".airlab/control-plane/inference-policy.json"
      - ".airlab/control-plane/canonical-sync-receipts.json"
      - ".airlab/roadmap.yaml"
      - ".airlab/public-repositories/**/roadmap.yaml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Autonomous CI Evidence Probe"]
    types: [completed]

permissions:
  contents: write
  actions: write
  checks: read
  pull-requests: read

concurrency:
  group: canonical-control-plane-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile latest main and project canonical state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECONCILE_TRIGGER: ${{ github.event_name }}
          VERIFIER_RUN_ID: ${{ github.event.workflow_run.id }}
          VERIFIER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-orchestrator-control-plane"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            # Extension operations fail closed at ingress. Malformed parseable requests
            # are quarantined before a specialized processor can abort the serialized run.
            python tools/control_plane_extension_ingress.py guard

            # Reviewer-only stale-block recovery must run before any new claim can be accepted.
            python tools/control_plane_reviewer_reconcile.py process

            # CP-HARDEN-07: consume enter_wait/resume_wait first, then quarantine
            # ordinary claim requests that collide with wait reservations.
            python tools/control_plane_wait_inbox.py process

            # CP-HARDEN-06: capture authoritative pre-sync roadmap digests at material
            # review acceptance and validate evidence-backed before/after receipts before
            # canonical_sync_complete can reach the ordinary mutation processor.
            python tools/canonical_sync_receipts.py prepare

            # Never trust workflow_run event fields as approval; the enqueue
            # re-fetches protected run, artifact, PR, exact CI and safe diff.
            if [[ "${RECONCILE_TRIGGER}" == "workflow_run" && "${VERIFIER_CONCLUSION}" == "success" && -n "${VERIFIER_RUN_ID:-}" ]]; then
              python -m tools.autonomous_needs_enqueue "${VERIFIER_RUN_ID}" || echo "Protected needs run was not eligible for completion."
            fi

            python tools/control_plane_inbox.py process

            # Finalize a receipt only after the ordinary inbox proves the matching request
            # was APPLIED and the lane actually reached G7_CANONICAL_SYNC=PASS.
            python tools/canonical_sync_receipts.py finalize
            python tools/control_plane_manager.py reconcile
            python tools/control_plane_wait_inbox.py validate
            python tools/canonical_sync_receipts.py check

            if git diff --quiet; then
              echo "Canonical state already current."
              python tools/validate_control_plane.py
              if [[ "${RECONCILE_TRIGGER}" == "push" ]]; then
                python -m tools.autonomous_needs_dispatch || echo "No eligible needs-only verifier dispatch."
              fi
              exit 0
            fi

            git add \
              .airlab/control-plane/canonical-state.json \
              .airlab/control-plane/workstreams/ \
              .airlab/control-plane/inbox/ \
              .airlab/control-plane/canonical-sync-receipts.json
            git commit -m "control-plane: apply guarded mutations and reconcile"

            if git push origin HEAD:main; then
              python -m tools.autonomous_needs_dispatch || echo "No eligible needs-only verifier dispatch."
              # Validation intentionally runs after the atomic state commit.
              # If a pre-existing malformed lane exists, projection incidents stay visible
              # and the workflow still fails closed instead of hiding all healthy lanes.
              python tools/validate_control_plane.py
              python tools/control_plane_wait_inbox.py validate
              python tools/canonical_sync_receipts.py check
              exit 0
            fi

            echo "Push raced with another main update; retrying guarded requests from latest main."
          done

          echo "Unable to apply guarded control-plane state after three attempts." >&2
          exit 1
