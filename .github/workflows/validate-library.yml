name: Validate Module Library

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog, needs and module contracts
        run: python tools/validate_library.py

      - name: Validate version history and observations
        run: python tools/validate_history.py

      - name: Run Library tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
