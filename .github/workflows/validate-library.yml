name: Validate Module Library

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical control plane
        run: |
          python tools/validate_control_plane.py
          python tools/canonical_sync_receipts.py check

      - name: Validate catalog, needs and module contracts
        run: python tools/validate_library.py

      - name: Validate version history and observations
        run: python tools/validate_history.py

      - name: Validate lifecycle ledger and availability state
        run: python tools/validate_lifecycle.py

      - name: Run Library tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v


      - name: Test real pinned Researcher-to-Library handoff module (Linux)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from library_source_integrity import payload_tree_sha256
          base = Path("intake/library.integration.firstparty.researcher_handoff/0.1.0")
          manifest = json.loads((base / "manifest.json").read_text())
          actual = payload_tree_sha256(base / "payload/src")
          assert actual == manifest["payload"]["sha256"], "researcher handoff payload changed"
          assert manifest["provenance"]["source_commit"] == "bacb1bca23c96fea0a492fe5ca98d020dae53445"
          print("PASS: immutable handoff source digest", actual)
          PY
          python -m unittest discover \
            -s intake/library.integration.firstparty.researcher_handoff/0.1.0/payload/src/test \
            -p 'test_*.py' -v

      - name: Verify materialized Mia OTA source hash
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from library_source_integrity import payload_tree_sha256
          base = Path('intake/release.update_manager.firstparty.mia/0.1.0')
          manifest = json.loads((base / 'manifest.json').read_text())
          assert payload_tree_sha256(base / 'payload/src') == manifest['payload']['sha256']
          print('PASS: pinned Mia OTA source tree SHA-256')
          PY

      - name: Set up Node.js for real Mia OTA sandbox tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute Mia OTA sandbox tests
        run: node --test intake/release.update_manager.firstparty.mia/0.1.0/tests/node-ota.test.mjs

      - name: Verify and test recovered Cantiere source before experimental publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from library_source_integrity import payload_tree_sha256
          base = Path("intake/library.integration.firstparty.cantiere_preview_reader/0.1.0")
          manifest = json.loads((base / "manifest.json").read_text())
          digest = payload_tree_sha256(base / "payload/src")
          assert digest == manifest["payload"]["sha256"], "Cantiere materialized source hash mismatch"
          assert manifest["provenance"]["source_commit"] == "f94055868061850e3f2cf6318358bab9e49f80c9"
          print("PASS: immutable Cantiere reuse source SHA256", digest)
          PY
          python -m unittest discover -s intake/library.integration.firstparty.cantiere_preview_reader/0.1.0/payload/src/test/tool -p 'test_*.py' -v

      - name: Verify extracted Cantiere image vision provenance and Dart payload SHA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from library_source_integrity import payload_tree_sha256
          base = Path("intake/vision.image_label_postprocessing.firstparty.cantiere/0.1.0")
          manifest = json.loads((base / "manifest.json").read_text())
          assert manifest["provenance"]["source_commit"] == "acc8d28b54489c91cb4f59552a1be2e07203de1a"
          assert payload_tree_sha256(base / "payload/src") == manifest["payload"]["sha256"], "image label source changed"
          print("PASS: source-tree digest and pinned Cantiere origin")
          PY
          bundle="intake/vision.image_label_postprocessing.firstparty.cantiere/0.1.0/payload/src/reference/cantiere"
          test "$(git hash-object "$bundle/LocalImageVisionBridge.kt")" = "210613e0b45a85bf72bf685c45ebf10a10999f43"
          test "$(git hash-object "$bundle/chat_local_image_vision_service.dart")" = "c34a7c0bee21c7b44c90b4ecd5bf6c913aa3db72"
          test "$(git hash-object "$bundle/chat_local_image_vision_service_test.dart")" = "73bf737b8a65696f354492f0a70fe99f66927c08"
          echo "PASS: three original Cantiere source blobs preserved exactly"

      - name: Set up Dart SDK for standalone image label module
        uses: dart-lang/setup-dart@v1

      - name: Analyze and run real extracted Dart image-label code
        shell: bash
        working-directory: intake/vision.image_label_postprocessing.firstparty.cantiere/0.1.0/payload/src
        run: |
          set -euo pipefail
          dart pub get --offline
          dart analyze
          dart run tool/self_test.dart

      - name: Test first real external Dart logging source registered in Library intake
        shell: bash
        working-directory: intake/diagnostics.logging.dartlang.logging_adapter/0.1.0/payload/src
        run: |
          set -euo pipefail
          dart pub get --offline
          dart analyze lib
          dart analyze tool
          dart run tool/self_test.dart

      - name: Verify a separate Dart app can import and use the real external Library module
        shell: bash
        working-directory: examples/external_logging_consumer
        run: |
          set -euo pipefail
          dart pub get --offline
          dart analyze
          dart run bin/main.dart

      - name: Generate source-bound external logging review request and CycloneDX inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/external_dart_logging_review.py \
            --root . --output "$RUNNER_TEMP/external-logging-independent-review-REQUEST.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          review = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) /
               "external-logging-independent-review-REQUEST.json").read_text()
          )
          assert review["status"] == "INDEPENDENT_REVIEW_REQUIRED"
          assert review["certification_authorized"] is False
          assert review["independent_security_reviewed"] is False
          assert any(f["severity"] == "blocking"
                     for f in review["risks_requiring_resolution"])
          sbom = review["dependency_inventory"]["cyclonedx_sbom"]
          path = (Path(os.environ["RUNNER_TEMP"]) /
                  "external-logging-cyclonedx-SBOM.json")
          path.write_text(json.dumps(sbom, indent=2, sort_keys=True) + "\n")
          print("PASS: bounded source and licenses, review still required")
          PY

      - name: Upload unsigned external-source review request for independent auditor
        uses: actions/upload-artifact@v4
        with:
          name: external-dart-logging-independent-review-REQUEST-NOT-CERTIFIED
          path: |
            ${{ runner.temp }}/external-logging-independent-review-REQUEST.json
            ${{ runner.temp }}/external-logging-cyclonedx-SBOM.json
          if-no-files-found: error
          retention-days: 14

      - name: Export deterministic offline Library snapshot
        run: python tools/library_resolver.py export-cache --output /tmp/ai-orchestrator-module-library.json

      - name: Validate offline snapshot
        run: python tools/validate_snapshot.py /tmp/ai-orchestrator-module-library.json
