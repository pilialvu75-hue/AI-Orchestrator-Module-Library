name: Validate Module Library

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog, needs and module contracts
        run: python tools/validate_library.py

      - name: Validate version history and observations
        run: python tools/validate_history.py

      - name: Validate lifecycle ledger and availability state
        run: python tools/validate_lifecycle.py

      - name: Run Library tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Export deterministic offline Library snapshot
        run: python tools/library_resolver.py export-cache --output /tmp/ai-orchestrator-module-library.json

      - name: Validate offline snapshot
        run: python tools/validate_snapshot.py /tmp/ai-orchestrator-module-library.json
