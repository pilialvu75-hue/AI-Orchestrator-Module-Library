name: Validate Drift intake evidence

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-drift-intake.yml"
      - "tools/materialize_upstream_evidence.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-library-drift-evidence-main
  cancel-in-progress: false

env:
  ASSET_ID: storage.local_db.simolus3.drift
  ASSET_VERSION: 0.1.0
  SOURCE_REPOSITORY: https://github.com/simolus3/drift.git
  SOURCE_COMMIT: 1e8bb788a8815d1e18e5c18d1705a2ca3cba6580

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Module Library main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Detect pending Drift intake
        id: intake
        shell: bash
        run: |
          set -euo pipefail
          intake="intake/${ASSET_ID}/${ASSET_VERSION}/manifest.json"
          certified="modules/${ASSET_ID}/${ASSET_VERSION}/manifest.json"
          if [[ -f "${intake}" ]]; then
            echo "pending=true" >> "${GITHUB_OUTPUT}"
            echo "Drift intake is pending validation."
          elif [[ -f "${certified}" ]]; then
            echo "pending=false" >> "${GITHUB_OUTPUT}"
            echo "Drift is already certified; validation workflow is idempotently complete."
          else
            echo "::error title=Drift state missing::Neither intake nor certified manifest exists for ${ASSET_ID}@${ASSET_VERSION}."
            exit 1
          fi

      - name: Checkout immutable Drift upstream
        if: ${{ steps.intake.outputs.pending == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/drift-upstream
          git -C /tmp/drift-upstream remote add origin "$SOURCE_REPOSITORY"
          git -C /tmp/drift-upstream fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C /tmp/drift-upstream checkout --detach FETCH_HEAD
          test "$(git -C /tmp/drift-upstream rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Set up Flutter stable
        if: ${{ steps.intake.outputs.pending == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve immutable workspace dependencies
        if: ${{ steps.intake.outputs.pending == 'true' }}
        working-directory: /tmp/drift-upstream
        run: flutter pub get

      - name: Analyze Drift package
        if: ${{ steps.intake.outputs.pending == 'true' }}
        working-directory: /tmp/drift-upstream/drift
        run: dart analyze --fatal-infos

      - name: Test Drift package
        if: ${{ steps.intake.outputs.pending == 'true' }}
        working-directory: /tmp/drift-upstream/drift
        run: dart test

      - name: Capture dependency graph
        if: ${{ steps.intake.outputs.pending == 'true' }}
        working-directory: /tmp/drift-upstream/drift
        run: dart pub deps --json > /tmp/drift-deps.json

      - name: Materialize test and security evidence
        if: ${{ steps.intake.outputs.pending == 'true' }}
        run: |
          python tools/materialize_upstream_evidence.py \
            --asset-dir "intake/${ASSET_ID}/${ASSET_VERSION}" \
            --upstream-dir /tmp/drift-upstream \
            --deps-json /tmp/drift-deps.json

      - name: Verify evidence against Library gates
        if: ${{ steps.intake.outputs.pending == 'true' }}
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          from library_evidence import verify_manifest_evidence
          base = Path('intake/storage.local_db.simolus3.drift/0.1.0')
          manifest = json.loads((base / 'manifest.json').read_text(encoding='utf-8'))
          verify_manifest_evidence(base, manifest)
          PY
          python tools/validate_library.py

      - name: Run fail-closed certification autopilot
        if: ${{ steps.intake.outputs.pending == 'true' }}
        run: python tools/library_autopilot.py --report /tmp/library-autopilot-report.json

      - name: Validate certified Library state
        if: ${{ steps.intake.outputs.pending == 'true' }}
        run: |
          python tools/validate_library.py
          python tools/validate_history.py
          python tools/validate_lifecycle.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/library_resolver.py export-cache --output /tmp/ai-orchestrator-module-library.json
          python tools/validate_snapshot.py /tmp/ai-orchestrator-module-library.json
          python tools/validate_snapshot.py catalog/offline-snapshot.json

      - name: Commit certified Drift and consumption exports
        if: ${{ steps.intake.outputs.pending == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code; then
            echo "No Drift certification/export changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog modules intake packages
          git commit -m "library: certify Drift from verified evidence [skip ci]"
          git push origin HEAD:main

      - name: Upload certification report
        if: ${{ always() && steps.intake.outputs.pending == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: drift-certification-report
          path: /tmp/library-autopilot-report.json
          if-no-files-found: ignore
          retention-days: 7
