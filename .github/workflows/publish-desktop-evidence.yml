name: Publish desktop consumer evidence
on:
  workflow_run:
    workflows: [Development exported module regression]
    types: [completed]
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: development-platform-evidence-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: development-export-*
          path: receipts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.payload.workflow_run.id, filter: 'latest'
            });
            const mapping = {'linux':'ubuntu-24.04','windows':'windows-latest','macos':'macos-latest'};
            const fs = require('fs');
            const ids = {};
            for (const [target, runner] of Object.entries(mapping)) {
              const matches = jobs.filter(j => j.name === 'independent-consumer (' + runner + ')' && j.conclusion === 'success');
              if (matches.length !== 1) throw new Error('Missing unique successful job: ' + runner);
              ids[target] = matches[0].id;
              fs.renameSync('receipts/development-export-' + runner, 'receipts/' + target);
            }
            fs.writeFileSync('jobs.json', JSON.stringify(ids));
      - name: Reconcile verified receipts against current immutable packages
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 tools/reconcile_platform_evidence.py --root . --receipts receipts --run-id "$RUN_ID" --jobs jobs.json
          git add packages/development-platform-evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "library: update independently tested desktop compatibility"
          git push origin HEAD:main
