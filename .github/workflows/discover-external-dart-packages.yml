name: Discover real external Dart modules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/discover_external_dart_packages.py'
      - 'tools/build_external_args_consumer.py'
      - 'tools/materialize_discovered_args.py'
      - '.github/workflows/discover-external-dart-packages.yml'
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
      - name: Discover real upstream modules at pinned Git commit
        run: python3 tools/discover_external_dart_packages.py --output "$RUNNER_TEMP/discovered-modules.json"
      - name: Verify discovery contains candidates beyond original three profiles
        run: |
          python3 - "$RUNNER_TEMP/discovered-modules.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data["candidate_count"] > 0
          assert len(data["source_commit"]) == 40
          assert data["certification_authorized"] is False
          print("Real upstream candidates:", data["candidate_count"])
          print("New names:", [x["package"] for x in data["candidates"] if x["package"] not in ("path","characters","fixnum")][:20])
          PY
      - name: Acquire selected upstream package and execute its actual tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/discovered-modules.json" "$RUNNER_TEMP" <<'PY'
          import json, pathlib, subprocess, sys
          data=json.load(open(sys.argv[1]))
          root=pathlib.Path(sys.argv[2])
          package=data["selected_package"]
          assert package not in ("path", "characters", "fixnum")
          subprocess.run(["git", "clone", "--quiet", "--filter=blob:none", data["repository"], str(root/"upstream")], check=True)
          subprocess.run(["git", "-C", str(root/"upstream"), "checkout", "--quiet", data["source_commit"]], check=True)
          target=root/"upstream"/data["selected_source_path"]
          assert target.is_dir() and (target/"pubspec.yaml").is_file()
          (root/"selected-module.txt").write_text(package + "\\n" + data["source_commit"] + "\\n")
          print("Testing new real upstream package:", package, "at", data["source_commit"])
          PY
          cd "$RUNNER_TEMP/upstream/$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/discovered-modules.json"))["selected_source_path"])')"
          dart pub get
          dart analyze
          dart test
      - name: Generate and execute independent consumer against selected upstream package
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_external_args_consumer.py "$RUNNER_TEMP/discovered-modules.json" "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/independent_consumer"
          dart pub get
          dart analyze
          dart run bin/main.dart
      - name: Record successful independent consumer proof
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/consumer-evidence.json" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          data=json.loads(p.read_text())
          assert data["package"] == "args"
          assert len(data["checks"]) == 5
          data["status"] = "CONSUMER_PASS"
          p.write_text(json.dumps(data, indent=2)+"\n")
          print("Independent consumer PASS for",data["package"])
          PY
      - name: Materialize TESTED-only Library candidate from proven source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/materialize_discovered_args.py "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          PYTHONPATH=tools python3 - "$RUNNER_TEMP/library_candidate" <<'PY'
          import json, pathlib, sys
          from library_source_integrity import payload_tree_sha256
          base=pathlib.Path(sys.argv[1])/"intake/utility.cli_arguments.external.dartlang.args/0.1.0"
          m=json.loads((base/"manifest.json").read_text())
          assert m["status"]=="tested" and m["security"]["reviewed"] is False
          assert payload_tree_sha256(base/m["payload"]["path"])==m["payload"]["sha256"]
          assert (base/"payload/src/vendor/args/lib/args.dart").is_file()
          print("PASS: real source bundle with verified digest and TESTED-only manifest")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: args-library-tested-candidate-not-certified
          path: ${{ runner.temp }}/library_candidate/
          retention-days: 14
      - name: Publish real selected module test evidence
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/selected-module.txt" ]; then
            cat "$RUNNER_TEMP/selected-module.txt"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: real-external-dart-discovery-not-tested
          path: |
            ${{ runner.temp }}/discovered-modules.json
            ${{ runner.temp }}/selected-module.txt
            ${{ runner.temp }}/consumer-evidence.json
          retention-days: 14
