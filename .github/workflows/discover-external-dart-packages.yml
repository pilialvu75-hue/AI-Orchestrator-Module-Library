name: Discover real external Dart modules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/discover_external_dart_packages.py'
      - '.github/workflows/discover-external-dart-packages.yml'
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
      - name: Discover real upstream modules at pinned Git commit
        run: python3 tools/discover_external_dart_packages.py --output "$RUNNER_TEMP/discovered-modules.json"
      - name: Verify discovery contains candidates beyond original three profiles
        run: |
          python3 - "$RUNNER_TEMP/discovered-modules.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data["candidate_count"] > 0
          assert len(data["source_commit"]) == 40
          assert data["certification_authorized"] is False
          print("Real upstream candidates:", data["candidate_count"])
          print("New names:", [x["package"] for x in data["candidates"] if x["package"] not in ("path","characters","fixnum")][:20])
          PY
      - name: Acquire selected upstream package and execute its actual tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/discovered-modules.json" "$RUNNER_TEMP" <<'PY'
          import json, pathlib, subprocess, sys
          data=json.load(open(sys.argv[1]))
          root=pathlib.Path(sys.argv[2])
          package=data["selected_package"]
          assert package not in ("path", "characters", "fixnum")
          subprocess.run(["git", "clone", "--quiet", "--filter=blob:none", data["repository"], str(root/"upstream")], check=True)
          subprocess.run(["git", "-C", str(root/"upstream"), "checkout", "--quiet", data["source_commit"]], check=True)
          target=root/"upstream"/data["selected_source_path"]
          assert target.is_dir() and (target/"pubspec.yaml").is_file()
          (root/"selected-module.txt").write_text(package + "\\n" + data["source_commit"] + "\\n")
          print("Testing new real upstream package:", package, "at", data["source_commit"])
          PY
          cd "$RUNNER_TEMP/upstream/$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/discovered-modules.json"))["selected_source_path"])')"
          dart pub get
          dart analyze
          dart test
      - name: Publish real selected module test evidence
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/selected-module.txt" ]; then
            cat "$RUNNER_TEMP/selected-module.txt"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: real-external-dart-discovery-not-tested
          path: |
            ${{ runner.temp }}/discovered-modules.json
            ${{ runner.temp }}/selected-module.txt
          retention-days: 14
