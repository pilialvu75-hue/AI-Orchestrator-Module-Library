name: Certify upstream Researcher intakes

on:
  push:
    branches: ["main"]
    paths:
      - "intake/**/manifest.json"
      - "intake/**/provenance/**"
      - ".github/workflows/certify-upstream-intakes.yml"
      - "tools/materialize_upstream_evidence.py"
      - "tools/library_autopilot.py"
  workflow_dispatch:

# Read-only is the workflow default. Only the final trusted promotion job may
# request write access to the Library.
permissions:
  contents: read

concurrency:
  group: module-library-upstream-certification-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout Library metadata only
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Build immutable upstream validation plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path, PurePosixPath

          repo_re = re.compile(
              r"^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:\.git)?$"
          )
          sha_re = re.compile(r"^[a-fA-F0-9]{40}$")
          id_re = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$")
          version_re = re.compile(
              r"^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$"
          )

          rows = []
          for path in sorted(Path("intake").glob("*/*/manifest.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              payload = data.get("payload") or {}
              if (
                  data.get("status") != "discovered"
                  or payload.get("type") != "upstream_reference"
              ):
                  continue

              provenance = data.get("provenance") or {}
              asset_id = str(data.get("id") or "").strip()
              version = str(data.get("version") or "").strip()
              repository = str(
                  payload.get("upstream_repository")
                  or provenance.get("source_repository")
                  or ""
              ).strip()
              commit = str(
                  payload.get("upstream_commit")
                  or provenance.get("source_commit")
                  or ""
              ).strip().lower()
              entry_paths = data.get("entry_paths") or []
              component = str(entry_paths[0]).strip() if entry_paths else "."

              if not id_re.fullmatch(asset_id):
                  raise SystemExit(f"unsafe asset id in {path}")
              if not version_re.fullmatch(version):
                  raise SystemExit(f"unsafe version in {path}")
              if not repo_re.fullmatch(repository):
                  raise SystemExit(f"unsafe upstream repository in {path}")
              if not sha_re.fullmatch(commit):
                  raise SystemExit(f"unsafe upstream commit in {path}")
              if component != ".":
                  pure = PurePosixPath(component)
                  if (
                      pure.is_absolute()
                      or ".." in pure.parts
                      or "." in pure.parts
                      or "\\" in component
                      or ":" in component
                  ):
                      raise SystemExit(f"unsafe component path in {path}")

              rows.append(
                  {
                      "index": f"{len(rows) + 1:04d}",
                      "asset_id": asset_id,
                      "version": version,
                      "source_repository": repository,
                      "source_commit": commit,
                      "component_path": component,
                      "snapshot_path": (
                          f"intake/{asset_id}/{version}/payload"
                          if (path.parent / "payload").is_dir()
                          else ""
                      ),
                  }
              )

          matrix = {"include": rows}
          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(
                  "matrix="
                  + json.dumps(matrix, sort_keys=True, separators=(",", ":"))
                  + "\n"
              )
              handle.write(f"count={len(rows)}\n")
          print(json.dumps(matrix, indent=2, sort_keys=True))
          PY

  stage_trusted_source:
    needs: prepare
    if: ${{ needs.prepare.outputs.count != '0' }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Library snapshot metadata
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Stage immutable private source without executing it
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ matrix.source_repository }}
          SOURCE_COMMIT: ${{ matrix.source_commit }}
          PLAN_INDEX: ${{ matrix.index }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/source-${PLAN_INDEX}.tar.gz"
          SNAPSHOT="intake/${{ matrix.asset_id }}/${{ matrix.version }}/payload"
          if [[ -d "${SNAPSHOT}" ]] && find "${SNAPSHOT}" -type f -print -quit | grep -q .; then
            tar -czf "${ARCHIVE}" -C "${SNAPSHOT}" .
          else
            OWNER_REPO="${SOURCE_REPOSITORY#https://github.com/}"
            OWNER_REPO="${OWNER_REPO%.git}"
            gh api -H "Accept: application/vnd.github+json" \
              "/repos/${OWNER_REPO}/tarball/${SOURCE_COMMIT}" > "${ARCHIVE}"
          fi
          test -s "${ARCHIVE}"
      - name: Upload immutable source artifact
        uses: actions/upload-artifact@v6
        with:
          name: upstream-source-${{ matrix.index }}
          path: ${{ runner.temp }}/source-${{ matrix.index }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  validate_untrusted:
    needs: [prepare, stage_trusted_source]
    if: ${{ needs.prepare.outputs.count != '0' }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    # This job intentionally has no repository permission and does not checkout
    # the private Library. It is the only job that executes upstream code.
    permissions: {}

    steps:
      - name: Download immutable source artifact
        uses: actions/download-artifact@v6
        with:
          name: upstream-source-${{ matrix.index }}
          path: ${{ runner.temp }}/staged-source

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Execute immutable upstream validation in unprivileged job
        shell: bash
        env:
          ASSET_ID: ${{ matrix.asset_id }}
          ASSET_VERSION: ${{ matrix.version }}
          SOURCE_REPOSITORY: ${{ matrix.source_repository }}
          SOURCE_COMMIT: ${{ matrix.source_commit }}
          COMPONENT_PATH: ${{ matrix.component_path }}
          PLAN_INDEX: ${{ matrix.index }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          UPSTREAM="${RUNNER_TEMP}/upstream-${PLAN_INDEX}"
          OUT="${RUNNER_TEMP}/validation"
          rm -rf "${UPSTREAM}" "${OUT}"
          mkdir -p "${OUT}"

          mkdir -p "${UPSTREAM}"
          tar -xzf "${RUNNER_TEMP}/staged-source/source-${PLAN_INDEX}.tar.gz" \
            -C "${UPSTREAM}" --strip-components=1
          test -d "${UPSTREAM}"

          PACKAGE_DIR="${UPSTREAM}/${COMPONENT_PATH}"
          if [ -f "${PACKAGE_DIR}/pubspec.yaml" ]; then
            VALIDATION_PROFILE="dart_package"
            VALIDATED_ON="linux"
            if grep -Eq '^[[:space:]]*resolution:[[:space:]]*workspace' "${PACKAGE_DIR}/pubspec.yaml"; then
              (cd "${UPSTREAM}" && flutter pub get)
            else
              (cd "${PACKAGE_DIR}" && dart pub get)
            fi
            (cd "${PACKAGE_DIR}" && dart analyze --fatal-infos)
            (cd "${PACKAGE_DIR}" && dart test)
            (cd "${PACKAGE_DIR}" && dart pub deps --json > "${OUT}/deps.json")
          elif [ -f "${PACKAGE_DIR}/CMakeLists.txt" ]; then
            echo "Native private-source validation requires separately staged immutable submodules; keeping candidate un-certified." >&2
            exit 1
            VALIDATION_PROFILE="native_android_cmake"
            VALIDATED_ON="android"
            test -n "${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
            NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME}}"
            LLAMA_SUBMODULE_SHA="$(git -C "${UPSTREAM}" ls-tree HEAD third_party/llama.cpp | awk '{print $3}')"
            test -n "${LLAMA_SUBMODULE_SHA}"
            export LLAMA_SUBMODULE_SHA
            git -C "${UPSTREAM}" submodule update --init --recursive
            test "$(git -C "${UPSTREAM}/third_party/llama.cpp" rev-parse HEAD)" = "${LLAMA_SUBMODULE_SHA}"
            cmake -S "${PACKAGE_DIR}" -B "${OUT}/build" \
              -DCMAKE_TOOLCHAIN_FILE="${NDK}/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "${OUT}/build" --target llama_bridge --parallel 2
            printf '{"packages":[]}\n' > "${OUT}/deps.json"
          else
            echo "Unsupported upstream validation profile for ${COMPONENT_PATH}" >&2
            exit 1
          fi
          export VALIDATION_PROFILE VALIDATED_ON

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["RUNNER_TEMP"]) / "validation"
          receipt = {
              "schema": "ai-orchestrator.library-upstream-validation.v1",
              "index": os.environ["PLAN_INDEX"],
              "asset_id": os.environ["ASSET_ID"],
              "version": os.environ["ASSET_VERSION"],
              "source_repository": os.environ["SOURCE_REPOSITORY"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "component_path": os.environ["COMPONENT_PATH"],
              "runner": "ubuntu-24.04",
              "analyze": "passed",
              "tests": "passed",
              "validation_profile": os.environ["VALIDATION_PROFILE"],
              "validated_on": os.environ["VALIDATED_ON"],
              "native_dependencies": (
                  [{
                      "name": "llama.cpp",
                      "repository": "https://github.com/ggerganov/llama.cpp",
                      "commit": os.environ["LLAMA_SUBMODULE_SHA"],
                      "license_reviewed": False,
                      "security_reviewed": False,
                  }]
                  if os.environ["VALIDATION_PROFILE"] == "native_android_cmake"
                  else []
              ),
          }
          (out / "receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload bounded validation evidence
        uses: actions/upload-artifact@v6
        with:
          name: upstream-validation-${{ matrix.index }}
          path: ${{ runner.temp }}/validation/
          if-no-files-found: error
          retention-days: 2

  promote_trusted:
    needs: [prepare, validate_untrusted]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.prepare.outputs.count == '0' || needs.validate_untrusted.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout trusted Library main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download untrusted-job evidence
        if: ${{ needs.prepare.outputs.count != '0' }}
        uses: actions/download-artifact@v6
        with:
          pattern: upstream-validation-*
          path: ${{ runner.temp }}/upstream-validation
          merge-multiple: false

      - name: Materialize evidence without executing upstream code
        id: evidence
        env:
          PLAN_JSON: ${{ needs.prepare.outputs.matrix }}
          EVIDENCE_ROOT: ${{ runner.temp }}/upstream-validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("tools").resolve()))
          from library_evidence import verify_manifest_evidence

          plan = json.loads(os.environ["PLAN_JSON"]).get("include", [])
          evidence_root = Path(os.environ["EVIDENCE_ROOT"])
          applied = 0

          for item in plan:
              index = str(item["index"])
              asset_id = str(item["asset_id"])
              version = str(item["version"])
              expected = {
                  "index": index,
                  "asset_id": asset_id,
                  "version": version,
                  "source_repository": str(item["source_repository"]),
                  "source_commit": str(item["source_commit"]).lower(),
                  "component_path": str(item["component_path"]),
              }

              artifact = evidence_root / f"upstream-validation-{index}"
              receipt_path = artifact / "receipt.json"
              deps_path = artifact / "deps.json"
              if not receipt_path.is_file() or not deps_path.is_file():
                  raise SystemExit(f"missing validation evidence for plan item {index}")

              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              for key, value in expected.items():
                  if str(receipt.get(key, "")) != value:
                      raise SystemExit(
                          f"validation receipt mismatch for {asset_id}@{version}: {key}"
                      )
              if (
                  receipt.get("schema")
                  != "ai-orchestrator.library-upstream-validation.v1"
                  or receipt.get("analyze") != "passed"
                  or receipt.get("tests") != "passed"
                  or receipt.get("runner") != "ubuntu-24.04"
                  or receipt.get("validation_profile") not in {"dart_package", "native_android_cmake"}
                  or receipt.get("validated_on") not in {"linux", "android"}
              ):
                  raise SystemExit(f"invalid validation receipt for {asset_id}@{version}")
              native_dependencies = receipt.get("native_dependencies") or []
              if receipt.get("validation_profile") == "native_android_cmake":
                  if not native_dependencies:
                      raise SystemExit(f"native dependency inventory missing for {asset_id}@{version}")
                  if any(
                      dep.get("license_reviewed") is not True
                      or dep.get("security_reviewed") is not True
                      for dep in native_dependencies
                  ):
                      print(
                          f"{asset_id}@{version}: native dependency review incomplete; "
                          "keeping intake un-certified."
                      )
                      continue
              if receipt.get("validation_profile") != "native_android_cmake" and native_dependencies:
                  raise SystemExit(f"unexpected native dependency inventory for {asset_id}@{version}")
              asset_dir = Path("intake") / asset_id / version
              manifest_path = asset_dir / "manifest.json"
              certified_path = Path("modules") / asset_id / version / "manifest.json"
              if not manifest_path.is_file():
                  if certified_path.is_file():
                      print(f"{asset_id}@{version} already certified; skipping.")
                      continue
                  raise SystemExit(f"intake disappeared for {asset_id}@{version}")

              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              payload = manifest.get("payload") or {}
              provenance = manifest.get("provenance") or {}
              current_repository = str(
                  payload.get("upstream_repository")
                  or provenance.get("source_repository")
                  or ""
              ).strip()
              current_commit = str(
                  payload.get("upstream_commit")
                  or provenance.get("source_commit")
                  or ""
              ).strip().lower()
              entry_paths = manifest.get("entry_paths") or []
              current_component = (
                  str(entry_paths[0]).strip() if entry_paths else "."
              )
              if (
                  current_repository != expected["source_repository"]
                  or current_commit != expected["source_commit"]
                  or current_component != expected["component_path"]
                  or manifest.get("status") != "discovered"
                  or (payload.get("type") or "") != "upstream_reference"
              ):
                  raise SystemExit(
                      f"current Library intake diverged for {asset_id}@{version}"
                  )

              upstream = Path("/tmp") / f"trusted-upstream-{index}"
              shutil.rmtree(upstream, ignore_errors=True)
              subprocess.run(["git", "init", str(upstream)], check=True)
              subprocess.run(
                  ["git", "-C", str(upstream), "remote", "add", "origin", current_repository],
                  check=True,
              )
              subprocess.run(
                  [
                      "git",
                      "-C",
                      str(upstream),
                      "fetch",
                      "--depth=1",
                      "origin",
                      current_commit,
                  ],
                  check=True,
              )
              subprocess.run(
                  ["git", "-C", str(upstream), "checkout", "--detach", "FETCH_HEAD"],
                  check=True,
              )
              actual_commit = subprocess.check_output(
                  ["git", "-C", str(upstream), "rev-parse", "HEAD"],
                  text=True,
              ).strip().lower()
              if actual_commit != current_commit:
                  raise SystemExit(f"immutable commit mismatch for {asset_id}@{version}")

              subprocess.run(
                  [
                      sys.executable,
                      "tools/materialize_upstream_evidence.py",
                      "--asset-dir",
                      str(asset_dir),
                      "--upstream-dir",
                      str(upstream),
                      "--deps-json",
                      str(deps_path),
                      "--validated-on",
                      str(receipt["validated_on"]),
                      "--package-label",
                      asset_id,
                      "--validation-profile",
                      str(receipt["validation_profile"]),
                  ],
                  check=True,
              )
              refreshed = json.loads(manifest_path.read_text(encoding="utf-8"))
              verify_manifest_evidence(asset_dir, refreshed)
              applied += 1

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"pending={'true' if applied else 'false'}\n")
          print(f"Trusted evidence materialized for {applied} intake candidate(s).")
          PY

      - name: Run fail-closed certification autopilot
        if: ${{ steps.evidence.outputs.pending == 'true' }}
        run: python tools/library_autopilot.py --report /tmp/library-autopilot-report.json

      - name: Reconcile capability needs from certified state
        if: ${{ steps.evidence.outputs.pending == 'true' }}
        run: python tools/library_needs_reconciler.py

      - name: Validate certified Library state
        if: ${{ steps.evidence.outputs.pending == 'true' }}
        run: |
          python tools/validate_library.py
          python tools/validate_history.py
          python tools/validate_lifecycle.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/library_resolver.py export-cache --output /tmp/ai-orchestrator-module-library.json
          python tools/validate_snapshot.py /tmp/ai-orchestrator-module-library.json
          python tools/validate_snapshot.py catalog/offline-snapshot.json

      - name: Commit verified certifications and exports
        if: ${{ steps.evidence.outputs.pending == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code; then
            echo "No certification/export changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog modules intake packages
          git commit -m "library: certify verified upstream intakes [skip ci]"
          git push origin HEAD:main

      - name: Upload certification report
        if: ${{ always() && steps.evidence.outputs.pending == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: upstream-intake-certification-report
          path: /tmp/library-autopilot-report.json
          if-no-files-found: ignore
          retention-days: 7
