name: Delta Engine binary candidate
on:
  pull_request:
    paths:
      - 'experiments/delta_engine/**'
      - '.github/workflows/delta-engine-binary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
      - name: Test and benchmark standalone codec
        working-directory: experiments/delta_engine/0.2.0
        run: dart run test/stability.dart
