name: Pilot fixnum in a separate Dart consumer (TESTED only)

on:
  pull_request:
    paths:
      - 'intake/utility.int64_arithmetic.external.dartlang.fixnum/**'
      - '.github/workflows/fixnum-separate-consumer.yml'
  push:
    branches: [main]
    paths:
      - 'intake/utility.int64_arithmetic.external.dartlang.fixnum/**'
      - '.github/workflows/fixnum-separate-consumer.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Certify eligible intake']
    types: [completed]

permissions:
  contents: read

jobs:
  separate-consumer:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          submodules: false
      - uses: dart-lang/setup-dart@v1
      - name: Verify actual source and TESTED-only status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "tools")
          from library_source_integrity import payload_tree_sha256
          base = pathlib.Path("intake/utility.int64_arithmetic.external.dartlang.fixnum/0.1.0")
          m = json.loads((base / "manifest.json").read_text())
          assert m["id"] == "utility.int64_arithmetic.external.dartlang.fixnum"
          assert m["status"] == "tested"
          assert m["security"]["reviewed"] is False
          assert payload_tree_sha256(base / m["payload"]["path"]) == m["payload"]["sha256"]
          PY
      - name: Consume published experimental package in a separate Dart app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from library_consumer_execution import canonical, safe_path
          pin = 'utility.int64_arithmetic.external.dartlang.fixnum@0.1.0'
          index = json.loads(Path('packages/experimental-index.json').read_text())
          assert index['certified'] is False
          rows = [r for r in index['packages'] if r['pin'] == pin]
          assert len(rows) == 1, 'fixnum is missing from published preview'
          row = rows[0]
          assert row['path'].startswith('packages/experimental/')
          envelope = json.loads(Path(row['path']).read_text())
          package = envelope['package']
          digest = hashlib.sha256(canonical(package).encode('utf-8')).hexdigest()
          assert digest == row['package_sha256'] == envelope['package_sha256']
          assert (package['pin'] == pin and package['tier'] == 'sandbox_preview'
                  and package['availability'] == 'experimental'
                  and package['certified'] is False and
                  package['review']['production_approved'] is False)
          assert package['integrity']['payload_sha256'] == (
              'b7241fcdfca77f7ec525da0279fa527ff9ca403ca7af592cc9bff804d4776f6a')
          output = Path(os.environ['RUNNER_TEMP']) / 'exported_fixnum'
          output.mkdir()
          seen = set()
          assert 0 < len(package['files']) <= 512
          for item in package['files']:
              relative = safe_path(item['target_path'])
              assert str(relative) not in seen and isinstance(item['content'], str)
              seen.add(str(relative))
              target = output.joinpath(*relative.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(item['content'], encoding='utf-8')
          assert {'pubspec.yaml', 'lib/aivexus_external.dart', 'tool/self_test.dart'} <= seen
          print('PASS: reconstructed actual exported sandbox package', digest)
          PY
          mkdir -p "$RUNNER_TEMP/fixnum_consumer/bin"
          mkdir -p "$RUNNER_TEMP/fixnum_consumer/bin"
          cat > "$RUNNER_TEMP/fixnum_consumer/pubspec.yaml" <<EOF
          name: independent_fixnum_consumer
          publish_to: none
          environment:
            sdk: ^3.4.0
          dependencies:
            aivexus_external_fixnum:
              path: $RUNNER_TEMP/exported_fixnum
          EOF
          cat > "$RUNNER_TEMP/fixnum_consumer/bin/main.dart" <<'EOF'
          import 'package:aivexus_external_fixnum/aivexus_external.dart';
          void main() {
            final ops = AivexusIntOps();
            const cases = <(int, int, int)>[
              (3, 8, 11), (0, 0, 0), (-7, 12, 5),
              (-20, -22, -42), (2147483647, 1, 2147483648),
            ];
            for (final (a, b, expected) in cases) {
              final actual = ops.sum(a, b);
              if (actual != expected) {
                throw StateError('sum($a, $b): $actual != $expected');
              }
            }
            print('PASS: separate consumer imported real vendored fixnum and passed ${cases.length} cases');
          }
          EOF
          cd "$RUNNER_TEMP/fixnum_consumer"
          dart pub get --offline
          dart analyze
          dart run bin/main.dart
      - name: Explicit non-certification result
        run: echo 'PASS means Linux consumer functionality only; security certification and production installation remain BLOCKED.'
