name: LLM Dart Candidate Generator Checks

on:
  pull_request:
    paths:
      - 'tools/generate_llm_dart_candidate.py'
      - 'tools/test_generate_llm_dart_candidate.py'
      - '.github/workflows/llm-dart-candidate-checks.yml'
  push:
    branches: [main]
    paths:
      - 'tools/generate_llm_dart_candidate.py'
      - 'tools/test_generate_llm_dart_candidate.py'
      - '.github/workflows/llm-dart-candidate-checks.yml'

permissions:
  contents: read

jobs:
  validate-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_generate_llm_dart_candidate.py' -v
      - run: python -m py_compile tools/generate_llm_dart_candidate.py
