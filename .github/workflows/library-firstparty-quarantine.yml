name: Library First-Party Quarantine Triage

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/library-firstparty-quarantine.yml"
      - "tools/library_firstparty_quarantine.py"
      - "tools/library_intake_readiness.py"
      - "intake/**"
      - "catalog/needs.json"
      - "catalog/index.json"
  schedule:
    - cron: "49 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: library-firstparty-quarantine-triage
  cancel-in-progress: false

jobs:
  quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Quarantine only allowlisted first-party intake
        run: |
          set -euo pipefail
          python -m tools.library_firstparty_quarantine --apply > "$RUNNER_TEMP/firstparty-triage.json"
          cat "$RUNNER_TEMP/firstparty-triage.json"
      - name: Build deterministic intake evidence-gap and coverage inventory
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.library_intake_readiness --output catalog/intake-readiness.json

      - name: Validate Library and run all tests before a write
        run: |
          set -euo pipefail
          python tools/validate_library.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Persist allowlisted quarantine and evidence inventory with bounded CAS retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Multiple protected Library workflows can legitimately update main.
          # Never force-push a stale report or overwrite another workflow's
          # certification state. Re-fetch, regenerate and revalidate for EACH
          # attempt so the report corresponds to the actual winning main head.
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: calculate readiness against current main."
            git fetch origin main
            git reset --hard origin/main

            python -m tools.library_firstparty_quarantine --apply > "$RUNNER_TEMP/firstparty-triage.json"
            python -m tools.library_intake_readiness --output catalog/intake-readiness.json
            python tools/validate_library.py
            python -m unittest discover -s tests -p 'test_*.py' -v

            git add -u -- \
              intake/ai.acceleration_backend.firstparty.ai-orchestrator-core/0.1.0/manifest.json \
              intake/ai.local_inference.firstparty.ai-orchestrator-core/0.1.0/manifest.json
            git add -- catalog/intake-readiness.json
            if git diff --cached --quiet; then
              echo "The current main already has up-to-date evidence inventory."
              exit 0
            fi
            while IFS= read -r changed; do
              case "$changed" in
                intake/ai.acceleration_backend.firstparty.ai-orchestrator-core/0.1.0/manifest.json|intake/ai.local_inference.firstparty.ai-orchestrator-core/0.1.0/manifest.json|catalog/intake-readiness.json)
                  ;;
                *)
                  echo "Out-of-scope Library metadata write: $changed" >&2
                  exit 1
                  ;;
              esac
            done < <(git diff --cached --name-only)
            git commit -m "library: publish current intake evidence gaps without certification"
            if git push origin HEAD:main; then
              echo "Published evidence inventory on current main."
              exit 0
            fi
            echo "Main advanced during metadata push; regenerate from latest head." >&2
          done
          echo "Readiness reconciliation exhausted three compare-and-swap retries." >&2
          exit 1

      - name: Publish first-party triage evidence
        if: always()
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/firstparty-triage.json" ]]; then
            {
              echo "## First-party Library quarantine triage"
              echo "Protected main workflow; metadata-only quarantine, no executable promotion."
              echo '~~~json'
              cat "$RUNNER_TEMP/firstparty-triage.json"
              echo '~~~'
              echo "### Read-only intake readiness summary"
              python -c 'import json; from pathlib import Path; summary=json.loads(Path("catalog/intake-readiness.json").read_text())["summary"]; print(json.dumps(summary, indent=2, sort_keys=True))'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Triage report absent (job did not reach evaluation)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload triage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firstparty-quarantine-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/firstparty-triage.json
            catalog/intake-readiness.json
          if-no-files-found: warn
          retention-days: 14
