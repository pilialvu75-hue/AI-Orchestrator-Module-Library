name: Harvest Cantiere source for Library module reuse

on:
  push:
    branches: ["main"]
    paths:
      - "tools/cantiere_code_reuse_harvest.py"
      - "tools/cantiere_reuse_materialize.py"
      - "tests/test_cantiere_reuse_materialize.py"
      - "tests/test_cantiere_code_reuse_harvest.py"
      - ".github/workflows/harvest-cantiere-reuse.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: library-cantiere-source-harvest
  cancel-in-progress: false

jobs:
  source-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout canonical Library
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify analysis is read-only, repeatable and fail-closed
        run: |
          python -m unittest discover -s tests -p 'test_cantiere_code_reuse_harvest.py' -v
          python -m unittest discover -s tests -p 'test_cantiere_reuse_materialize.py' -v
      - name: Analyse all changed Cantiere source on a pinned GitHub head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python tools/cantiere_code_reuse_harvest.py | tee "$RUNNER_TEMP/cantiere-reuse.json"
            git add -- catalog/cantiere-code-reuse-ledger.json
            if git diff --cached --quiet; then
              echo "Cantiere source already analysed."
              exit 0
            fi
            git commit -m "library: observe pinned Cantiere code for reuse (not modules)"
            if git push origin HEAD:main; then
              echo "Cantiere analysis stored in Library without touching Researcher claims."
              exit 0
            fi
            echo "Library main moved: compare against fresh cursor and retry."
          done
          echo "Source analysis CAS retries exhausted. Cursor remains intact on main." >&2
          exit 1
      - name: Stage one first-party Cantiere code+test candidate without execution
        shell: bash
        run: |
          set -euo pipefail
          # Source bytes are fetched only at the exact ledger source commit.
          # The stager never executes or promotes them. Git write remains
          # scoped to Library intake and its own observation ledger.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python tools/cantiere_reuse_materialize.py | tee "$RUNNER_TEMP/cantiere-materialize.json"
            python tools/validate_library.py
            git add -A -- catalog/cantiere-code-reuse-ledger.json intake/
            if git diff --cached --quiet; then
              echo "No new test-backed Cantiere Python source to materialize."
              exit 0
            fi
            while IFS= read -r path; do
              case "$path" in
                catalog/cantiere-code-reuse-ledger.json|intake/library.integration.firstparty.cantiere_*/0.1.0/manifest.json|intake/library.integration.firstparty.cantiere_*/0.1.0/payload/src/*)
                  ;;
                *)
                  echo "Out-of-scope Cantiere auto-staging path: $path" >&2
                  exit 1
                  ;;
              esac
            done < <(git diff --cached --name-only)
            git commit -m "library: stage pinned Cantiere reusable source (tests not yet run)"
            if git push origin HEAD:main; then
              echo "Pinned source materialized; no automatic test pass or publication claimed."
              exit 0
            fi
          done
          echo "Cantiere materialization exhausted compare-and-swap retries" >&2
          exit 1

      - name: Attach read-only classification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cantiere-module-reuse-harvest-${{ github.run_id }}
          path: ${{ runner.temp }}/cantiere-reuse.json
          if-no-files-found: ignore
          retention-days: 7
