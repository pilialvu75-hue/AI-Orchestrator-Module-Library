name: Probe immutable upstream Swift packages (no certification)

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-upstream-swift.yml"
      - "tools/swift_probe.py"
      - "tools/swift_adapter.py"
      - "tools/swift_sandbox_bundle.py"
      - "tools/complete_swift_testing.py"
      - "tools/swift_security_preflight.py"
      - "tools/swift_adapters/**"
  schedule:
    # Cheap daily Linux planner; an unchanged source commit is probed once.
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-swift-native-probe-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
      adapter_count: ${{ steps.bridge_plan.outputs.count }}
    steps:
      - name: Checkout only trusted Library metadata
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            intake
            tools
      - name: Plan exactly one new pinned Swift package
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/swift_probe.py plan --root . --output "$RUNNER_TEMP/swift-plan.json"
          if [[ "$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/swift-plan.json"))["count"])')" == "1" ]]; then
            SOURCE="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/swift-plan.json"))["source_path"])')"
            tar -czf "$RUNNER_TEMP/swift-pinned-source.tar.gz" -C "$SOURCE" .
          fi
      - name: Stage immutable source and bound plan
        if: ${{ steps.plan.outputs.count == '1' }}
        uses: actions/upload-artifact@v6
        with:
          name: pinned-swift-probe-input
          path: |
            ${{ runner.temp }}/swift-plan.json
            ${{ runner.temp }}/swift-pinned-source.tar.gz
          if-no-files-found: error
          retention-days: 2


      - name: Plan and stage one real Aivexus Swift logging bridge
        id: bridge_plan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.plan.outputs.count }}" != "0" ]]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "Upstream package probe has priority; defer bridge to next cycle."
            exit 0
          fi
          python3 tools/swift_adapter.py plan --root . --output "$RUNNER_TEMP/swift-adapter-plan.json"
          if [[ "$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/swift-adapter-plan.json"))["count"])')" == "1" ]]; then
            python3 tools/swift_adapter.py stage --root . \
              --plan "$RUNNER_TEMP/swift-adapter-plan.json" \
              --output "$RUNNER_TEMP/swift-bridge-patched"
            tar -czf "$RUNNER_TEMP/swift-bridge-patched.tar.gz" \
              -C "$RUNNER_TEMP/swift-bridge-patched" .
          fi
      - name: Upload trusted native adapter build input
        if: ${{ steps.bridge_plan.outputs.count == '1' }}
        uses: actions/upload-artifact@v6
        with:
          name: swift-bridge-input
          path: |
            ${{ runner.temp }}/swift-adapter-plan.json
            ${{ runner.temp }}/swift-bridge-patched.tar.gz
          retention-days: 2
          if-no-files-found: error

  verify_untrusted:
    needs: prepare
    if: ${{ needs.prepare.outputs.count == '1' }}
    runs-on: macos-26
    timeout-minutes: 18
    # No repository checkout and no code-write permissions on this runner.
    permissions: {}
    steps:
      - name: Download source-only artifact
        uses: actions/download-artifact@v6
        with:
          name: pinned-swift-probe-input
          path: ${{ runner.temp }}/swift-staged
      - name: Run upstream Swift package tests on Apple runner
        shell: bash
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swift-source"
          tar -xzf "$RUNNER_TEMP/swift-staged/swift-pinned-source.tar.gz" -C "$RUNNER_TEMP/swift-source"
          test -f "$RUNNER_TEMP/swift-source/Package.swift"
          test -f "$RUNNER_TEMP/swift-source/Package.resolved"
          xcodebuild -version
          swift --version
          python3 - <<'PY'
          import re, subprocess
          version = subprocess.check_output(["swift", "--version"], text=True)
          match = re.search(r"Swift version (\d+)\.(\d+)", version)
          if match is None or (int(match.group(1)), int(match.group(2))) < (6, 2):
              raise SystemExit("Swift 6.2+ required for nonisolated(nonsending)")
          PY
          set +e
          (cd "$RUNNER_TEMP/swift-source" && swift test --disable-automatic-resolution -j 2) > "$RUNNER_TEMP/swift-test.log" 2>&1
          result=$?
          set -e
          tail -n 60 "$RUNNER_TEMP/swift-test.log"
          export SWIFT_EXIT="$result"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          plan = json.loads((temp / "swift-staged/swift-plan.json").read_text())
          result = {
              "schema": "ai-orchestrator.swift-test-run.v1",
              "asset_id": plan["asset_id"],
              "version": plan["version"],
              "source_commit": plan["source_commit"],
              "payload_sha256": plan["payload_sha256"],
              "platform": "macos",
              "toolchain_profile": "macos26-xcode26-swift62",
              "test_exit_code": int(os.environ["SWIFT_EXIT"]),
          }
          (temp / "swift-probe-result.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY
          exit "$result"
      - name: Upload test outcome even if build or tests failed
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: pinned-swift-probe-result
          path: ${{ runner.temp }}/swift-probe-result.json
          if-no-files-found: warn
          retention-days: 7

  record_trusted:
    needs: [prepare, verify_untrusted]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.count == '1' && (needs.verify_untrusted.result == 'success' || needs.verify_untrusted.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout current trusted Library
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Download bound plan and job receipt
        uses: actions/download-artifact@v6
        with:
          pattern: pinned-swift-probe-*
          path: ${{ runner.temp }}/swift-receipts
      - name: Record probe without altering module trust or lifecycle
        shell: bash
        env:
          JOB_RESULT: ${{ needs.verify_untrusted.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 tools/swift_probe.py record --root . \
            --plan "$RUNNER_TEMP/swift-receipts/pinned-swift-probe-input/swift-plan.json" \
            --result "$RUNNER_TEMP/swift-receipts/pinned-swift-probe-result/swift-probe-result.json" \
            --job-result "$JOB_RESULT" \
            --run-id "$RUN_ID"
          git add -- intake/*/*/provenance/swift-probe.json
          if git diff --cached --quiet; then
            echo "Identical source already probed."
            exit 0
          fi
          python3 tools/validate_library.py
          python3 -m unittest discover -s tests -p 'test_swift_probe.py' -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "library: record native Swift test outcome, not certification [skip ci]"
          git push origin HEAD:main


  verify_adapter_untrusted:
    needs: prepare
    if: ${{ needs.prepare.outputs.adapter_count == '1' }}
    runs-on: macos-26
    timeout-minutes: 18
    permissions: {}
    steps:
      - name: Download source-bound trusted bridge overlay
        uses: actions/download-artifact@v6
        with:
          name: swift-bridge-input
          path: ${{ runner.temp }}/swift-bridge-input
      - name: Execute native Aivexus adapter contract tests without write permissions
        shell: bash
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swift-bridge"
          tar -xzf "$RUNNER_TEMP/swift-bridge-input/swift-bridge-patched.tar.gz" -C "$RUNNER_TEMP/swift-bridge"
          swift --version
          python3 - <<'PY'
          import re
          import subprocess
          version = subprocess.check_output(["swift", "--version"], text=True)
          match = re.search(r"Swift version (\d+)\.(\d+)", version)
          if match is None or (int(match.group(1)), int(match.group(2))) < (6, 2):
              raise SystemExit("Aivexus bridge needs Swift 6.2 or newer")
          PY
          set +e
          (cd "$RUNNER_TEMP/swift-bridge" && swift test --disable-automatic-resolution -j 2 --filter AivexusDiagnosticsBridgeTests) \
            > "$RUNNER_TEMP/swift-bridge-test.log" 2>&1
          result=$?
          set -e
          tail -n 80 "$RUNNER_TEMP/swift-bridge-test.log"
          export BRIDGE_EXIT="$result"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          plan = json.loads((root / "swift-bridge-input/swift-adapter-plan.json").read_text())
          fields = ("asset_id", "version", "source_commit", "payload_sha256",
                    "adapter_sha256", "contract_id", "platform", "toolchain_profile")
          receipt = {"schema": "ai-orchestrator.swift-adapter-test-run.v1",
                     **{key: plan[key] for key in fields},
                     "test_exit_code": int(os.environ["BRIDGE_EXIT"])}
          (root / "swift-bridge-result.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          PY
          exit "$result"
      - name: Upload source-bound actual adapter result
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: swift-bridge-result
          path: ${{ runner.temp }}/swift-bridge-result.json
          if-no-files-found: warn
          retention-days: 7

  record_adapter_trusted:
    needs: [prepare, verify_adapter_untrusted]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.adapter_count == '1' && (needs.verify_adapter_untrusted.result == 'success' || needs.verify_adapter_untrusted.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout current trusted Library
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Download immutable bridge plan and integration result
        uses: actions/download-artifact@v6
        with:
          pattern: swift-bridge-*
          path: ${{ runner.temp }}/bridge-receipts
      - name: Validate result against exact candidate and record non-certifying proof
        env:
          TEST_JOB_RESULT: ${{ needs.verify_adapter_untrusted.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 tools/swift_adapter.py record --root . \
            --plan "$RUNNER_TEMP/bridge-receipts/swift-bridge-input/swift-adapter-plan.json" \
            --result "$RUNNER_TEMP/bridge-receipts/swift-bridge-result/swift-bridge-result.json" \
            --job-result "$TEST_JOB_RESULT" \
            --run-id "$RUN_ID"
          git add -- intake/*/*/provenance/swift-adapter.json
          if git diff --cached --quiet; then
            echo "Same adapter/source combination was already tested."
            exit 0
          fi
          python3 tools/validate_library.py
          python3 -m unittest discover -s tests -p 'test_swift_adapter.py' -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "library: record tested native logging bridge, not certification [skip ci]"
          git push origin HEAD:main

  finalize_native_tested:
    # Independent metadata-only verifier: test receipts are NOT authority.
    # Re-fetch protected main job conclusions from GitHub before any writes.
    needs: [prepare, record_adapter_trusted]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.record_adapter_trusted.result == 'success' || needs.record_adapter_trusted.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout latest canonical Library main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Independently attest exact native job outcomes and advance to TESTED only
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/complete_swift_testing.py --root . \
            --output "$RUNNER_TEMP/verified-swift-tested.json"
          if [[ "$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/verified-swift-tested.json"))["tested"])')" != "1" ]]; then
            echo "No new fully source-bound native adapter test evidence."
            exit 0
          fi
          python3 tools/validate_library.py
          python3 -m unittest discover -s tests -p 'test_complete_swift_testing.py' -v
          git add -- catalog/intake-readiness.json
          git add -- intake/*/*/manifest.json
          git add -- intake/*/*/evidence/test-report.json
          if git diff --cached --quiet; then
            echo "Test state already confirmed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "library: attest native adapter as tested only, security pending [skip ci]"
          git push origin HEAD:main


  independent_security_preflight:
    # Separate trusted scan of the source/lockfile, never an approval.
    # No untrusted code executes here and no module certification is granted.
    needs: [prepare, finalize_native_tested]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.finalize_native_tested.result == 'success' || needs.finalize_native_tested.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout current immutable source evidence on main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Generate source-bound SwiftPM CycloneDX SBOM and independent OSV preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/swift_security_preflight.py --root . \
            --output "$RUNNER_TEMP/swift-security-preflight.json"
          if [[ "$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/swift-security-preflight.json"))["scanned"])')" != "1" ]]; then
            echo "No new TESTED Swift source requires a separate security preflight."
            exit 0
          fi
          python3 tools/validate_library.py
          python3 -m unittest discover -s tests -p 'test_swift_security_preflight.py' -v
          git add -- intake/*/*/evidence/security-preflight.json
          git add -- intake/*/*/evidence/sbom.cdx.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "library: record independent Swift SBOM and OSV preflight, security pending [skip ci]"
          git push origin HEAD:main


  export_verified_native_sandbox:
    # Produce actual runnable source for isolated macOS builder experiments.
    # NEVER certified, never an installer or a production module.
    needs: [prepare, finalize_native_tested, independent_security_preflight]
    if: ${{ github.event_name == 'push' && needs.prepare.result == 'success' && needs.finalize_native_tested.result == 'success' && needs.independent_security_preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - name: Checkout trusted Library without retained credentials
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Export immutable upstream and tested Aivexus adapter as sandbox-only SwiftPM
        id: export
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/swift_sandbox_bundle.py --root . \
            --archive "$RUNNER_TEMP/aivexus-swift-sandbox-source.tar.gz" \
            --output "$RUNNER_TEMP/aivexus-swift-sandbox-receipt.json"
          echo "Native Swift sandbox staging completed; see count in receipt."
      - name: Publish source archive for isolated macOS review (14 days only)
        if: ${{ steps.export.outputs.count == '1' }}
        uses: actions/upload-artifact@v6
        with:
          name: aivexus-swift-sandbox-source-NOT-CERTIFIED
          path: |
            ${{ runner.temp }}/aivexus-swift-sandbox-source.tar.gz
            ${{ runner.temp }}/aivexus-swift-sandbox-receipt.json
          if-no-files-found: error
          retention-days: 14
