name: Generated Dart Library intake candidate
on:
  pull_request:
    paths:
      - 'tools/generated_dart_intake_candidate.py'
      - '.github/workflows/generated-dart-intake-candidate.yml'
      - 'tools/generate_first_dart_module.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Generate real Dart package
        run: python3 tools/generate_first_dart_module.py --spec examples/first-generated-module-spec.json --output "$RUNNER_TEMP/generated"
      - name: Test package
        working-directory: ${{ runner.temp }}/generated
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Create immutable candidate bundle
        env:
          AIVEXUS_DART_TESTS_PASSED: "true"
        run: python3 tools/generated_dart_intake_candidate.py --package "$RUNNER_TEMP/generated" --output "$RUNNER_TEMP/candidate" --source-commit "$GITHUB_SHA"
      - name: Verify candidate digest and structure
        run: python3 tools/library_intake_bundle.py verify "$RUNNER_TEMP/candidate/bundle.json" --expected-sha256 "$(cat "$RUNNER_TEMP/candidate/bundle.sha256")"
      - name: Upload discovered candidate (not certified)
        uses: actions/upload-artifact@v4
        with:
          name: aivexus-running-total-discovered-intake-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
